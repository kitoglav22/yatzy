<!doctype html>
<!-- Аркада Яцзы (альфа) v71.4: собрано в закрытом репозитории yatzy-arcade, ветка PR #52, коммит 2c22de0 (NOTEBOOK_VERSION=71 npm run build → dist/notebook.html). Руками не править. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Аркада Яцзы (альфа)</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root {
  --felt: #12372a; --felt-2: #1a4a38; --line: #2f6b52; --ink: #f3efe2; --muted: #a9c2b5;
  --die: #f7f2e3; --pip: #1d2a24; --held: #f2b544; --chips: #4fa3e0; --mult: #e8584c; --gold: #f2b544; --ok: #5cc28a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--felt); color: var(--ink);
  font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
#app {
  max-width: 480px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 8px; min-height: 100%;
}

.top { display: grid; gap: 4px; }
.where { display: flex; justify-content: space-between; font-weight: 600; }
.kind { color: var(--muted); font-weight: 500; }
.kind.boss { color: var(--mult); }
.boss-line { font-size: 13px; line-height: 1.25; color: var(--muted); }
.boss-line.now { font-size: 15px; font-weight: 600; color: var(--mult); }
.die.void { opacity: .55; box-shadow: inset 0 0 0 2px var(--mult); }
.boss-intro { text-align: center; }
.boss-intro .ic { font-size: 56px; line-height: 1; }
.card .rule { font-size: 20px; font-weight: 700; color: var(--mult); }
.goal { display: grid; gap: 4px; }
.goal { border-radius: 12px; padding: 4px; transition: box-shadow .3s; }
.goal.last { box-shadow: 0 0 0 2px var(--mult); }
.bar { height: 12px; background: var(--felt-2); border-radius: 6px; overflow: hidden; position: relative; }
#bar { height: 100%; width: 0; background: var(--ok); transition: width .4s, background .4s; }
.goal.warn #bar { background: var(--gold); }
.goal.danger #bar { background: var(--mult); }
.pace { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .7; transition: left .4s; }
.goal-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.nums { font-size: 20px; }
.need { text-align: right; font-size: 14px; color: var(--muted); min-height: 1.3em; }
.need b { color: var(--ink); }
.goal.danger .need b, .goal.last .need b { color: var(--mult); }
.left { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 10px; color: var(--muted); font-size: 14px; }
.res { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
.res b { color: var(--ink); }
.pips { display: flex; flex-wrap: wrap; gap: 4px; max-width: 150px; }
.pips i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); transition: opacity .3s, transform .3s; }
.pips i.off { opacity: .18; transform: scale(.8); }
.pips.small { gap: 2px; max-width: 80px; }
.pips.small i { width: 6px; height: 6px; background: var(--gold); }

.amulets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.slot {
  height: 44px; border-radius: 12px; border: 1px dashed var(--line); display: grid; place-items: center;
  font-size: 24px; position: relative;
}
.slot.full { border: 1px solid var(--line); background: var(--felt-2); }
.slot.sel { outline: 2px solid var(--gold); }
.slot.fire { animation: fire .3s; }
.info { min-height: 1.4em; color: var(--muted); font-size: 13px; line-height: 1.3; display: flex; align-items: center; gap: 8px; }
.info b { color: var(--ink); }
.info .mv { padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); }

.calc { display: flex; justify-content: center; align-items: baseline; gap: 8px; font-weight: 700; font-size: 22px; line-height: 1.2; min-height: 27px; }
.chips { color: var(--chips); } .mult { color: var(--mult); } .x, .eq { color: var(--muted); font-size: 20px; }
.total { min-width: 3ch; }
.calc .bump { animation: bump .18s; }
.gain { text-align: center; font-size: 14px; line-height: 1.35; color: var(--muted); min-height: 19px; margin-top: -6px; }
.gain b { color: var(--gold); }
.abil { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.abil .stars { color: var(--gold); font-weight: 700; margin-right: 4px; }
.abil .hint { color: var(--muted); font-size: 14px; }
.abil .ab { padding: 6px 12px; border-radius: 10px; background: var(--felt-2); border: 1px solid var(--gold); font-size: 15px; }
.abil .ab.on { background: var(--gold); color: #2a1d05; font-weight: 700; }
.abil .ab.alt { border-color: var(--line); }
.abil .ab.closes { box-shadow: 0 0 0 2px var(--ok); border-color: var(--ok); }
.abil .ab:disabled { opacity: .45; }
.die.pickable { box-shadow: 0 0 0 2px var(--gold); }
.die.picked { box-shadow: 0 0 0 3px var(--gold); transform: translateY(-3px); }
.card h3 { margin: 4px 0 0; font-size: 18px; color: var(--gold); }
.pick.buy:disabled { opacity: .5; }
.pick .price { color: var(--gold); font-size: 14px; margin-left: 6px; }

.dice { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(100%, 330px); margin: 10px auto 0; }
.die {
  aspect-ratio: 1; border-radius: 14%; background: var(--die); padding: 14%;
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); box-shadow: 0 3px 0 #bcb59f;
  transition: transform .15s;
}
.die.blank { background: var(--felt-2); box-shadow: none; }
.die.held { transform: translateY(-8px); box-shadow: 0 0 0 3px var(--held), 0 3px 0 #bcb59f; }
.die.score { animation: bump .25s; }
.die { position: relative; }
/* a rattling die glides from one jolt to the next (the time is set per jolt in animateRoll) */
.die.shaking { transition: transform 45ms ease-in-out; will-change: transform; box-shadow: 0 8px 14px rgba(0, 0, 0, .25); }
/* landing: a squash, a bounce and a ring that fades out */
.die.land { animation: land .42s cubic-bezier(.2, 1.5, .4, 1); }
.die.land::before { content: ""; position: absolute; inset: -4px; border-radius: 17%; border: 2px solid var(--gold); animation: ring .5s ease-out forwards; pointer-events: none; }
.dice.shake { animation: shake .28s; }
.dice.yatzy { animation: glow 1.6s ease-out; border-radius: 14px; }
@keyframes land { 0% { transform: scale(1.18) rotate(-6deg); } 35% { transform: scale(1.08, .88); } 65% { transform: scale(.96, 1.05); } 100% { transform: none; } }
@keyframes ring { from { opacity: .8; transform: scale(.9); } to { opacity: 0; transform: scale(1.35); } }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(242, 181, 68, .7); } 100% { box-shadow: 0 0 0 22px transparent; } }
@media (prefers-reduced-motion: reduce) { .die.land, .die.land::before, .dice.shake, .dice.yatzy { animation: none; } }
.pip { width: 70%; aspect-ratio: 1; border-radius: 50%; background: var(--pip); place-self: center; visibility: hidden; }
.pip.on { visibility: visible; }

.roll {
  padding: 11px; border-radius: 14px; background: var(--gold); color: #2a1d05; font-weight: 700; font-size: 18px;
}
.roll:disabled { background: var(--felt-2); color: var(--muted); }

/* Бюрократ: a combination already played at this table */
.combo.used span:first-child { text-decoration: line-through; }
/* nine combinations as a 3 × 3 grid, so the whole table fits one phone screen: the name on top, chips × multiplier and the score under it */
.combos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.combo {
  display: grid; grid-template-columns: auto 1fr; grid-template-areas: "nm nm" "base pv"; gap: 2px 4px; align-items: baseline; text-align: left;
  padding: 6px 8px; border-radius: 10px; background: var(--felt-2); font-size: 14px; min-height: 50px; min-width: 0;
}
.combo:disabled { opacity: .45; }
.combo .nm { grid-area: nm; font-size: 13px; line-height: 1.2; }
.combo .nm small { color: var(--gold); font-size: 11px; }
.combo .base { grid-area: base; color: var(--muted); font-size: 12px; white-space: nowrap; }
.combo .pv { grid-area: pv; font-weight: 700; text-align: right; white-space: nowrap; }
/* small phones: narrower cells and smaller dice keep the table on one screen */
@media (max-width: 370px) { .combo { padding: 5px 6px; } .combo .nm { font-size: 12px; } }
@media (max-height: 700px) { .dice { width: min(100%, 280px); } }
.combo.best { outline: 2px solid var(--gold); }
/* the table's order: its combination is framed, the mark says how much it adds */
.combo.order { box-shadow: inset 0 0 0 1px var(--gold); }
.combo .ord { color: var(--gold); font-size: 11px; font-weight: 700; white-space: nowrap; }
.combo.best .pv::before { content: "▶"; color: var(--gold); font-size: .8em; margin-right: 2px; }

.foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: auto; }
.link { text-decoration: underline; color: var(--muted); }

/* a card taller than the screen scrolls inside the overlay; a short one stays centred (auto margins) */
.overlay { position: fixed; inset: 0; background: rgba(5, 20, 14, .82); display: flex; flex-direction: column; overflow-y: auto; padding: 16px; }
.card { margin: auto; width: 100%; max-width: 420px; background: var(--felt-2); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; }
.card h2 { margin: 0; font-size: 22px; }
.card p { margin: 0; color: var(--muted); }
.pick { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; text-align: left; padding: 12px; border-radius: 12px; background: var(--felt); border: 1px solid var(--line); }
.pick .ic { font-size: 32px; grid-row: span 2; }
.pick small { color: var(--muted); }
.note-box { display: grid; gap: 6px; padding: 10px; border-radius: 12px; background: rgba(242, 181, 68, .1); border: 1px solid var(--gold); }
.note-box b { color: var(--gold); font-size: 15px; }
.note { font: inherit; font-size: 15px; color: var(--ink); background: var(--felt); border: 1px solid var(--gold); border-radius: 10px; padding: 8px 10px; min-height: 84px; resize: vertical; user-select: text; }
.btn { padding: 12px; border-radius: 12px; background: var(--gold); color: #2a1d05; font-weight: 700; }
.btn.alt { background: none; border: 1px solid var(--line); color: var(--ink); }

/* balance panel */
.foot { flex-wrap: wrap; gap: 6px 12px; }
.tune-box { place-items: start center; overflow-y: auto; }
.tune { width: 100%; max-width: 480px; background: var(--felt-2); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.tune-head { display: flex; justify-content: space-between; align-items: center; }
.tune h2 { margin: 0; font-size: 20px; }
.tune p, .tune small { margin: 0; color: var(--muted); font-size: 13px; }
.tune details { border-top: 1px solid var(--line); padding-top: 8px; }
.tune summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.tune-grid { display: grid; grid-template-columns: 1fr 96px; gap: 6px 10px; align-items: center; padding: 6px 0; font-size: 14px; }
.tune input, .tune textarea { font: inherit; color: var(--ink); background: var(--felt); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
.tune input.diff { border-color: var(--gold); color: var(--gold); }
.tune textarea { min-height: 120px; font-family: ui-monospace, monospace; font-size: 12px; }
.tune-sim { display: grid; gap: 8px; }
.tune-sim table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tune-sim th, .tune-sim td { padding: 3px 4px; text-align: right; }
.tune-sim td:first-child { text-align: left; color: var(--muted); }

@keyframes bump { 50% { transform: scale(1.18); } }
@keyframes fire { 50% { transform: scale(1.15); background: var(--line); } }
@keyframes shake { 25% { transform: translateX(-4px) rotate(-1deg); } 75% { transform: translateX(4px) rotate(1deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.tip { margin: 0; padding: 8px 10px; border-radius: 10px; background: rgba(110, 200, 140, .12); border: 1px solid rgba(110, 200, 140, .6); font-size: 14px; line-height: 1.35; text-align: left; }
/* the end-of-run question: three answers, the chosen one lit */
.luck-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.luck-row .btn { padding: 10px 4px; font-size: 15px; }
.btn.alt.on { background: var(--gold); border-color: var(--gold); color: #2a1d05; }

/* under the calculation: the formula of the hand, chips blue, multiplier red */
.gain .c { color: var(--chips); } .gain .m { color: var(--mult); }
.combo .base i { font-style: normal; }
.combo .base.live .c { color: var(--chips); } .combo .base.live .m { color: var(--mult); }
/* combinations reference */
.help-list { display: grid; gap: 8px; }
.help-row { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: baseline; text-align: left; }
.help-row small { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.help-row .base i { font-style: normal; } .help-row .c { color: var(--chips); } .help-row .m { color: var(--mult); }
/* The notebook's look for the friends' alpha on the notebook site (tools/build.mjs adds it after style.css for dist/notebook.html):
   the notebook's colours, fonts, white cards and dice (src/style.css in kitoglav22/yatzy). Only the look changes, the layout stays. */
:root {
  --bg: #eef2f5; --paper: #ffffff; --rule: #d3dbe4; --accent: #1f5fd1; --on-accent: #ffffff; --accent-soft: #e3ecfb;
  --win-soft: #e2f3e8; --shadow: rgba(29, 42, 58, .12);
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
  --felt: var(--bg); --felt-2: var(--paper); --line: var(--rule); --ink: #1d2a3a; --muted: #5d6b80;
  --die: var(--paper); --pip: var(--ink); --held: var(--accent); --chips: var(--accent); --mult: #c23b22; --gold: #b36b00; --ok: #1f8a4c;
  color-scheme: light;
}
/* dark as the device is, unless Telegram sets the theme on <html> (ui/telegram.js) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1520; --paper: #182131; --rule: #2b384c; --accent: #6ea0ff; --on-accent: #0f1520; --accent-soft: #1f2f4d;
    --win-soft: #16301f; --shadow: rgba(0, 0, 0, .35);
    --ink: #e6ecf4; --muted: #93a1b5; --mult: #ff8a70; --gold: #f2b544; --ok: #5ccf8c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1520; --paper: #182131; --rule: #2b384c; --accent: #6ea0ff; --on-accent: #0f1520; --accent-soft: #1f2f4d;
  --win-soft: #16301f; --shadow: rgba(0, 0, 0, .35);
  --ink: #e6ecf4; --muted: #93a1b5; --mult: #ff8a70; --gold: #f2b544; --ok: #5ccf8c;
  color-scheme: dark;
}
body { background: var(--bg); font-family: var(--body); }
h2, .nums, .roll { font-family: var(--display); }
.calc { font-weight: 800; }
.nums b { font-weight: 800; }

/* the head of the table and the combinations are white cards, as the score sheet in the notebook */
.top { background: var(--paper); border: 1px solid var(--rule); border-radius: 16px; padding: 10px 14px; }
.bar { background: var(--rule); }
.pace { background: var(--ink); }
.combos { gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
.combo { border-radius: 0; background: var(--paper); }
/* a combination the dice do not make fades its text, not its cell, so the grid lines stay even */
.combo:disabled { opacity: 1; } .combo:disabled > * { opacity: .45; }
.combo.best { outline: 0; background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
.combo.best .pv::before { color: var(--accent); }

/* dice as in the notebook: white with a grey rim, a held die lifts and turns blue */
.die { background: var(--paper); border: 2px solid var(--rule); border-radius: 14px; box-shadow: 0 3px 0 var(--rule); padding: 12%; }
.die.blank { background: transparent; border-style: dashed; box-shadow: none; }
.die.held { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-6px); box-shadow: 0 8px 0 color-mix(in srgb, var(--accent) 35%, transparent); }
.die.shaking { box-shadow: 0 8px 14px var(--shadow); }
.die.land::before { border-radius: 17px; border-color: var(--accent); }
.die.pickable { box-shadow: 0 0 0 2px var(--gold); }
.die.picked { box-shadow: 0 0 0 3px var(--gold); }
.die.void { box-shadow: inset 0 0 0 2px var(--mult); }

.roll { background: var(--accent); color: var(--on-accent); border-radius: 12px; font-weight: 800; font-size: 17px; min-height: 46px; }
.roll:disabled { background: var(--rule); color: var(--muted); }
.btn { background: var(--accent); color: var(--on-accent); font-weight: 800; }
.btn.alt { background: var(--paper); border: 1.5px solid var(--rule); color: var(--ink); }
.btn.alt.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.slot { border-color: var(--rule); }
.slot.full { background: var(--paper); border-color: var(--rule); }
.slot.sel { outline-color: var(--accent); }
.abil .ab { background: var(--paper); }
.abil .ab.on { color: var(--paper); }
.pips i { background: var(--ink); }
.pips.small i { background: var(--gold); }
.info .mv { border-color: var(--rule); }

.overlay { background: rgba(15, 21, 32, .5); }
.card { background: var(--paper); border-color: var(--rule); box-shadow: 0 12px 32px var(--shadow); }
.card h3 { color: var(--accent); }
.pick { background: var(--bg); border-color: var(--rule); }
.note-box { background: var(--accent-soft); border-color: var(--accent); }
.note-box b { color: var(--accent); }
.note { background: var(--paper); border-color: var(--rule); color: var(--ink); }
.tip { background: var(--win-soft); border-color: var(--ok); color: var(--ink); }
.link { color: var(--accent); }

/* inside Telegram, full screen: keep clear of its buttons on top and the home bar below */
html.tgfull #app { padding-top: calc(12px + var(--tg-top, 0px)); padding-bottom: calc(12px + var(--tg-bottom, 0px)); }
html.tgfull body::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: var(--tg-top, 0px); background: var(--bg); z-index: 5; }
html.tgfull .overlay { padding-top: calc(16px + var(--tg-top, 0px)); padding-bottom: calc(16px + var(--tg-bottom, 0px)); }
</style>
</head>
<body>
<main id="app">
  <header class="top">
    <div class="where"><span id="stage"></span><span id="kind" class="kind"></span></div>
    <div id="bossLine" class="boss-line"></div>
    <div class="goal" id="goal">
      <div class="bar"><div id="bar"></div><div id="pace" class="pace"></div></div>
      <div class="goal-row"><div class="nums"><b id="points">0</b> / <span id="target"></span></div><div class="need" id="need"></div></div>
    </div>
    <div class="left">
      <div class="res"><span>Ходы <b id="turnsN"></b></span><span id="turns" class="pips"></span></div>
      <div class="res"><span>Перебросы <b id="rerollsN"></b></span><span id="rerolls" class="pips small"></span></div>
    </div>
  </header>

  <section class="amulets" id="amulets" aria-label="Амулеты"></section>
  <div class="info" id="info"></div>

  <section class="calc" id="calc" aria-live="polite">
    <span id="chips" class="chips">0</span><span class="x">×</span><span id="mult" class="mult">0</span><span class="eq">=</span><span id="total" class="total">0</span>
  </section>
  <div id="gain" class="gain" aria-live="polite"></div>

  <section class="dice" id="dice" aria-label="Кубики"></section>
  <button id="roll" class="roll">Бросить</button>
  <section id="abil" class="abil" aria-label="Способности" hidden></section>

  <section class="combos" id="combos" aria-label="Комбинации"></section>

  <footer class="foot"><a id="home" class="link" href="./" hidden>← Блокнот</a><span id="seed"></span><button id="help" class="link">Комбинации</button><button id="tune" class="link">⚙ Баланс</button><button id="new" class="link">Новый забег</button></footer>
</main>

<div id="overlay" class="overlay" hidden><div class="card" id="card"></div></div>
<div id="tuneBox" class="overlay tune-box" hidden></div>

<script>
(() => {
const M = {};
M["src/data/combos.js"] = (() => {
// Combinations: base chips and multiplier at level 1, and what each table level adds.
// Chips for a played combination = base + the faces of the dice that make it (`dice` says which).
// Edit numbers here, not in scoring.js. Status of these numbers in Docs/GDD.md: Г.
const __default = [

// Seeded random numbers: the same seed gives the same run, so a broken run can be replayed and balance checked
// mulberry32; the state is one 32-bit number, so it fits in a save

  let s = seed >>> 0;
  const next = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    int: (a, b) => a + Math.floor(next() * (b - a + 1)),
    get state() { return s; },
    set state(v) { s = v >>> 0; },
  };

  let h = 2166136261;
  for (const ch of String(code).toUpperCase()) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);

// Separate streams keep the shop and effects the same for everyone on a daily run,

function derive(seed, ...parts) {

    if (st.kind === 'amulet') {
      const ic = amulets[st.slot].icon;
      // chips simply add up, so an amulet firing on several dice reads as one number
      const had = chips.find(x => x[0] === ic);
      if (dc && had) had[1] += dc; else if (dc) chips.push([ic, dc]);
      if (st.mult !== prev.mult) {
        const e = amulets[st.slot].effects.find(x => (x.when === 'die') === (st.die !== undefined));
        const k = e?.times ? `×${round1(st.mult / prev.mult)}` : `+${round1(st.mult - prev.mult)}`;
        const last = mult.at(-1);
        // an amulet firing on several dice reads as one sum
        if (last && last[0] === ic && k[0] === '+' && last[1][0] === '+') last[1] = `+${round1(+last[1].slice(1) + +k.slice(1))}`;
        else mult.push([ic, k]);
      }
    }
    prev = st;
  }
  const sum = list => list.map(([ic, v]) => ` ${v < 0 ? '−' : '+'} ${Math.abs(v)}${ic}`).join('');
  const chipsText = `${base.chips}${faces.length ? ` + ${faces.join('+')}` : ''}${sum(chips)}`;
  // amulets count left to right: × binds before +, so brackets are needed only where a × follows a +
  let multText = `${round1(base.mult)}`, op = null;
  for (const [ic, k] of mult) {
    if (op === '+' && k[0] === '×') multText = `(${multText})`;
    op = k[0];
    multText += ` ${op} ${k.slice(1)}${ic}`;
  }
  const wrap = (t, open) => open ? `(${t})` : t;
  // the total is right above, in the calculation line: here only where its two numbers come from
  return `<span class="c">${wrap(chipsText, chipsText !== `${base.chips}`)}</span> × <span class="m">${wrap(multText, op === '+')}</span>`;
}

function setCalc(chips, mult, total) {
  for (const [id, v] of [['chips', chips], ['mult', mult], ['total', total]]) {
    const el = $(id);
    if (el.textContent !== String(v)) { el.textContent = v; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  }
}

// Replays the scoring steps: dice and amulets light up in the order they count
async function animate(s) {
  const dEls = $('dice').children, aEls = $('amulets').children;
  setCalc('', '', '');
  for (const [i, st] of s.steps.entries()) {
    if (st.kind === 'die') { dEls[st.die].classList.add('score'); }
    if (st.kind === 'amulet') { aEls[st.slot].classList.remove('fire'); void aEls[st.slot].offsetWidth; aEls[st.slot].classList.add('fire'); }
    setCalc(st.chips, Math.round(st.mult * 10) / 10, '');
    $('gain').innerHTML = explain(s, i + 1);
    await wait(st.kind === 'combo' ? 300 : 220);
  }
  setCalc(s.chips, s.mult, s.total);
  await wait(700);
}

async function onPlay(id) {
  if (busy) return;
  const dice = [...run.t.dice];
  busy = true; sel = -1; pick = null;
  const gains = amuletGains(dice, id);
  const s = play(run, id);
  if (!s) { busy = false; return; }
  log.add('p', id, s.total);
  if (scoreShown) markTips(['score']);
  log.save(run);
  save();
  // draw the dice that scored, not the cleared table, while the score plays
  $('dice').replaceChildren(...dice.map((f, i) => { const e = dieEl(f, i); e.classList.remove('held'); return e; }));
  for (const b of $('combos').children) b.disabled = true;
  $('roll').disabled = true;
  await animate(s);
  showGains(gains, s);
  busy = false;
  render();
}

// What each amulet added to this hand: the score with it minus the score without it.
// A zero is shown too, so the player sees when an amulet did not fire.
function amuletGains(dice, id) {
  const ctx = context(run), full = score(dice, id, ctx).total;
  return ctx.amulets.map((a, k) => ({ name: a.name, icon: a.icon, add: full - score(dice, id, { ...ctx, amulets: ctx.amulets.filter((_, j) => j !== k) }).total }));
}
// After the hand: its whole formula, the amulets that did not fire this time and the order's rerolls
function showGains(gains, s) {
  const idle = gains.filter(g => !g.add).map(g => ` · ${g.icon} мимо`).join('');
  const order = s?.rerolls ? ` · ${ORDER} +${s.rerolls} ${plural(s.rerolls, 'переброс', 'переброса', 'перебросов')}` : '';
  $('gain').innerHTML = s ? explain(s) + idle + order : '';
}

// a few words from the player after a boss and at the end of a run go into the playtest log
function noteBox() {
  const box = document.createElement('label'), t = document.createElement('textarea');
  box.className = 'note-box';
  box.innerHTML = '<b>✎ Пара слов для разбора</b>';
  t.id = 'note'; t.className = 'note'; t.placeholder = 'Что понравилось, что мешало? Можно пропустить.';
  t.value = log.noteAt(run.won);
  t.onchange = () => log.note(run.won, t.value.trim());
  box.append(t);
  $('card').append(box);
}

// the question of the playtests: did the player feel the run was theirs or the dice's
const LUCK = [['me', 'От меня'], ['both', 'Поровну'], ['luck', 'От удачи']];
function luckBox() {
  const box = document.createElement('div');
  box.className = 'note-box luck';
  box.innerHTML = '<b>От чего зависел исход?</b>';
  const row = document.createElement('div');
  row.className = 'luck-row';
  for (const [v, txt] of LUCK) {
    const b = document.createElement('button');
    b.textContent = txt; b.dataset.v = v;
    b.className = 'btn alt' + (log.current?.luck === v ? ' on' : '');
    b.onclick = () => { log.luck(v); row.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
    row.append(b);
  }
  box.append(row);
  $('card').append(box);
}

// a tip the player has not read yet, inside the card that brings its mechanic
let showing = [];
function tip(h, id) {
  if (seen(id)) return false;
  h('p', typeof TIP[id] === 'function' ? TIP[id]() : TIP[id]).className = 'tip';
  showing.push(id);
  return true;
}

// Every combination with its current level: what makes it, an example, chips × multiplier
function combosHelp(h, btn) {
  $('card').className = 'card help';
  h('h2', 'Комбинации');
  h('p', 'Очки = (фишки комбинации + сумма её кубиков) × множитель. Кубики после точки · не считаются.');
  const list = h('div', '');
  list.className = 'help-list';
  for (const c of COMBOS) {
    const lv = run.levels[c.id] || 1, [what, ex] = HELP[c.id];
    const row = document.createElement('div');
    row.className = 'help-row';
    row.innerHTML = `<b>${c.name}</b><span class="base"><i class="c">${c.chips + (lv - 1) * c.level.chips}</i>×<i class="m">${c.mult + (lv - 1) * c.level.mult}</i></span><small>${what}: ${ex}</small>`;
    list.append(row);
  }
  btn('Закрыть', () => { help = false; render(); });
}

// The boss is announced once, before its first roll, with its rule in large print
const bossKey = () => `${run.seed}:${run.stage}`;
function bossIntro(h, btn) {
  const b = bossFor(run), t = run.t;
  $('card').className = 'card boss-intro';
  h('div', b.icon).className = 'ic';
  h('h2', `Босс: ${b.name}`);
  h('p', b.desc[0].toUpperCase() + b.desc.slice(1)).className = 'rule';
  if (Object.keys(b.rules).length) tip(h, 'boss');
  h('p', `Цель ${t.target}. У вас ${t.turnsLeft} ${plural(t.turnsLeft, 'ход', 'хода', 'ходов')} и ${t.rerolls} ${plural(t.rerolls, 'переброс', 'переброса', 'перебросов')}.`);
  btn('В бой', () => { store.set(BOSS_SEEN, bossKey()); render(); });
}

function overlay() {
  const o = $('overlay'), card = $('card');
  const intro = run.phase === 'table' && isBoss(run) && !run.t.dice && store.get(BOSS_SEEN) !== bossKey();
  if (!help && (busy || (run.phase === 'table' && !intro))) { o.hidden = true; return; }
  o.hidden = false;
  card.replaceChildren();
  card.className = 'card';
  const h = (tag, txt) => { const e = document.createElement(tag); e.textContent = txt; card.append(e); return e; };
  // leaving the card by any of its buttons marks its tips as read
  const btn = (txt, fn, alt) => { const b = h('button', txt); b.className = 'btn' + (alt ? ' alt' : ''); b.onclick = () => { markTips(showing); fn(); }; return b; };
  showing = [];
  if (help) { combosHelp(h, btn); return; }
  if (intro) { bossIntro(h, btn); return; }
  if (run.phase === 'pick' && !seen('howto')) {
    h('h2', 'Как играть');
    for (const line of HOWTO(run.t.turns)) h('p', line);
    showing.push('howto');
    btn('Понятно', render);
    return;
  }
  if (run.phase === 'pick') {
    h('h2', 'Новый забег');
    h('p', 'Возьмите один амулет. Новый будет в начале каждого этапа.');
    amuletPick(h, btn, card);
    return;
  }
  if (run.phase === 'over') {
    h('h2', 'Забег окончен');
    h('p', `Не хватило ${run.t.target - run.t.points}: ${run.t.points} из ${run.t.target}.`).className = 'miss';
    luckBox();
    noteBox();
    h('p', `Пройдено столов: ${run.won}. Рекорд: ${+store.get(BEST) || 0}.`);
    btn('Новый забег', () => { run = fresh(); shown = { victory: false }; save(); render(); });
    return;
  }
  if (run.won === 3 && !shown.victory) {
    h('h2', 'Этап 1 пройден!');
    h('p', 'Можно играть дальше: цели растут, пока не проиграете.');
    btn('Играть дальше', () => { shown.victory = true; render(); });
    btn('Новый забег', () => { run = fresh(); shown = { victory: false }; save(); render(); }, true);
    return;
  }
  h('h2', isBoss(run) ? 'Босс побеждён' : 'Стол пройден');
  const spare = run.t.turnsLeft;
  h('p', `${run.t.points} из ${run.t.target}, ` + (spare ? `в запасе ${spare} ${plural(spare, 'ход', 'хода', 'ходов')}.` : 'на последнем ходу!'));
  wonTable(h, btn);
  if (!isBoss(run)) { btn('Дальше', () => { leaveShop(run); log.save(run); save(); render(); }); return; }
  noteBox();
  const ids = offer(run);
  if (!ids.length) {
    const took = run.t.took && amuletById[run.t.took];
    h('p', took ? `Амулет взят: ${took.icon} ${took.name}.` : run.amulets.length >= SLOTS ? 'Все слоты амулетов заняты.' : 'Амулетов больше нет.');
    btn('Дальше', () => { leaveShop(run); log.save(run); save(); render(); });
    return;
  }
  h('p', 'Новый этап: возьмите один амулет бесплатно.');
  amuletPick(h, btn, card);
}

function amuletPick(h, btn, card) {
  const ids = offer(run);
  if (!tip(h, 'amulet') && run.amulets.length) tip(h, 'amulets2');
  for (const id of ids) {
    const d = amuletById[id];
    const b = document.createElement('button');
    b.className = 'pick';
    b.innerHTML = `<span class="ic">${d.icon}</span><b>${d.name}</b><small>${d.desc}</small>`;
    b.onclick = () => { markTips(showing); log.add('a', id, ids); take(run, id, { stay: run.phase === 'shop' }); log.save(run); save(); render(); };
    card.append(b);
  }
  btn('Пропустить', () => { log.add('a', null, ids); leaveShop(run); log.save(run); save(); render(); }, true);
}

$('dice').addEventListener('click', e => {
  const d = e.target.closest('.die');
  if (!d || busy) return;
  if (pick) {
    if (!run.t.dice) return;
    if (run.abilities[pick.k] === 'single') applyAbility({ die: +d.dataset.i }); else { pick.die = +d.dataset.i; render(); }
    return;
  }
  hold(run, +d.dataset.i); log.add('h', +d.dataset.i); save(); render();
});
$('roll').addEventListener('click', () => {
  if (busy || !roll(run)) return;
  pick = null;
  log.add('r', run.t.dice.join(''));
  save(); setCalc(0, 0, 0); showGains([]);
  // with reduced motion the result shows at once
  if (fast) { render(); return; }
  busy = rolling = true;
  render();
  animateRoll(run.t.held.map(h => !h));
});

// The result is already rolled and saved; the animation only reveals it (as in the notebook):
// free dice rattle in place, calm down and land on their face one by one, each at its own moment.
// Math.random() here is only for the look; the dice themselves come from the seeded run.
let rolling = false;
function setFace(el, f) { [...el.children].forEach((p, q) => p.classList.toggle('on', PIPS[f].includes(q))); }
function animateRoll(free) {
  const els = [...$('dice').children], order = free.map((f, k) => (f ? k : -1)).filter(k => k >= 0);
  const span = 900 + Math.random() * 700, stopAt = {}, next = {}, face = {};
  const shake = $('dice');
  shake.classList.remove('shake'); void shake.offsetWidth; shake.classList.add('shake');
  for (const k of order) { stopAt[k] = 350 + Math.random() * (span - 350); els[k].classList.add('shaking'); }
  const t0 = performance.now(), j = a => (Math.random() * 2 - 1) * a;
  const tick = now => {
    const t = now - t0;
    for (const k of order) {
      const d = els[k];
      if (!d.classList.contains('shaking')) continue;
      if (t >= stopAt[k]) {
        d.classList.remove('shaking'); d.style.transitionDuration = ''; d.style.transform = '';
        setFace(d, run.t.dice[k]); void d.offsetWidth; d.classList.add('land');
        try { navigator.vibrate?.(15); } catch { /* no vibration */ }
        continue;
      }
      // a jolt: random offset and tilt, strong at first and calmer towards the stop, with a new face each time
      const left = (stopAt[k] - t) / stopAt[k], gap = left > .6 ? 45 : left > .3 ? 85 : 150;
      if (!next[k] || now >= next[k]) {
        const a = 3 + 9 * left;
        d.style.transitionDuration = gap + 'ms';
        d.style.transform = `translate3d(${j(a)}px,${j(a) - a * .6}px,0) rotate(${j(8 + 22 * left)}deg) scale(${1 + .06 * left})`;
        let f = 1 + Math.floor(Math.random() * 6); if (f === face[k]) f = f % 6 + 1;
        face[k] = f; setFace(d, f); next[k] = now + gap;
      }
    }
    if (t < Math.max(0, ...Object.values(stopAt)) + 450) { requestAnimationFrame(tick); return; }
    busy = rolling = false;
    render();
    if (run.t.dice.every(f => f === run.t.dice[0])) {
      shake.classList.remove('yatzy'); void shake.offsetWidth; shake.classList.add('yatzy');
      try { navigator.vibrate?.([40, 60, 40, 60, 120]); } catch { /* no vibration */ }
    }
  };
  requestAnimationFrame(tick);
}
$('combos').addEventListener('click', e => { const c = e.target.closest('.combo'); if (c && !c.disabled) onPlay(c.dataset.c); });
$('amulets').addEventListener('click', e => {
  const s = e.target.closest('.slot');
  if (!s) return;
  sel = +s.dataset.s === sel || !run.amulets[+s.dataset.s] ? -1 : +s.dataset.s;
  render();
});
$('info').addEventListener('click', e => {
  const m = e.target.closest('.mv');
  if (!m) return;
  log.add('m', sel, +m.dataset.to);
  moveAmulet(run, sel, +m.dataset.to); sel = +m.dataset.to; save(); render();
});
const tunedNow = () => { try { return Object.keys(JSON.parse(store.get('arcade.tune')) || {}).length; } catch { return tuned; } };
$('help').addEventListener('click', () => { if (busy) return; help = true; render(); });
$('tune').addEventListener('click', () => {
  if (busy) return;
  openTune($('tuneBox'), {
    store,
    amulets: run.amulets.map(a => a.id),
    onChange: () => { if (run.phase === 'table') run.t.target = targetFor(run.stage, run.t.kind); save(); render(); },
    onClose: () => log.add('t', tuneChanges()),
  });
});

// a second tap within 3 seconds confirms (confirm() is blocked inside some frames)
let sure = 0;
$('new').addEventListener('click', () => {
  if (busy) return;
  if (Date.now() - sure > 3000) {
    sure = Date.now(); $('new').textContent = 'Точно? Нажмите ещё раз';
    setTimeout(() => { $('new').textContent = 'Новый забег'; }, 3000);
    return;
  }
  sure = 0; $('new').textContent = 'Новый забег';
  run = fresh(); shown = { victory: false }; sel = -1; save(); setCalc(0, 0, 0); showGains([]); render();
});

// the friends' alpha: no balance panel, and a way back to the notebook
if (NOTEBOOK) { $('tune').hidden = true; $('home').hidden = false; telegram('./'); }

setCalc(0, 0, 0);
save();
render();

return {  };
})();
})();
</script>
