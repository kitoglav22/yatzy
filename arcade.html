<main id="app">

    </div>

    <span class="part pc"><span id="chips" class="chips">0</span><small aria-hidden="true">сумма</small></span><span class="x">×</span><span class="part pm"><span id="mult" class="mult">0</span><small aria-hidden="true">множитель</small></span><span class="eq">=</span><span class="part"><span id="total" class="total">0</span><small aria-hidden="true">очки</small></span>

  <button id="roll" class="roll">Бросить</button>
  <section id="abil" class="abil" aria-label="Способности" hidden></section>
  </div>

  <section class="combos" id="combos" aria-label="Комбинации"></section>
