<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Яцзы">

<link rel="icon" href="icon.png">
<title>Блокнот Яцзы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: a printed dice-game score block — one tall table, categories left, a column per player, tap a cell to pick a score */
:root{
  --bg:#eef2f5; --paper:#ffffff; --ink:#1d2a3a; --muted:#5d6b80; --rule:#d3dbe4;
  --accent:#1f5fd1; --on-accent:#ffffff; --accent-soft:#e3ecfb; --win:#187a42; --win-soft:#e2f3e8; --danger:#c23b22; --danger-soft:#fbe9e5; --ok:#1f8a4c; --stripe:rgba(31,95,209,.08);
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --paper:#182131; --ink:#e6ecf4; --muted:#93a1b5; --rule:#2b384c;
  --accent:#6ea0ff; --on-accent:#0f1520; --accent-soft:#1f2f4d; --win:#5ccf8c; --win-soft:#16301f; --danger:#ff8a70; --danger-soft:#3a2420; --ok:#5ccf8c; --stripe:rgba(110,160,255,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --paper:#182131; --ink:#e6ecf4; --muted:#93a1b5; --rule:#2b384c;
  --accent:#6ea0ff; --on-accent:#0f1520; --accent-soft:#1f2f4d; --win:#5ccf8c; --win-soft:#16301f; --danger:#ff8a70; --danger-soft:#3a2420; --ok:#5ccf8c; --stripe:rgba(110,160,255,.10); color-scheme:dark}
*{box-sizing:border-box}
/* no double-tap zoom: quick taps on dice and cells must stay taps; no rubber-band bounce, which on a sharp flick dragged the sticky dice panel and total row off their edges */
html,body{background:var(--bg);touch-action:manipulation;overscroll-behavior-y:none}
*{touch-action:manipulation}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.3;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.75rem;margin:0;display:flex;align-items:center;gap:12px}
.pip{display:inline-grid;grid-template-columns:repeat(3,6px);gap:3px;padding:6px;border-radius:9px;background:var(--accent)}
.pip i{width:6px;height:6px;border-radius:50%;background:var(--on-accent)}
.pip i.o{background:transparent}
.muted{font-size:.85rem;color:var(--muted);margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:0 18px;font-weight:700;min-height:48px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--on-accent)}
/* a long label (undo with two long names) wraps instead of pushing the page wider than the screen */
.btn{max-width:100%}
#undo{white-space:normal;line-height:1.2;padding-block:8px;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{min-height:40px;padding:0 12px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--rule);padding:8px 12px;text-align:left;vertical-align:middle}
td+td,th+th{border-left:1px solid var(--rule);text-align:center}
tbody tr:last-child td{border-bottom:0}
/* height:1px lets .ph fill the whole cell, so a one-line name centres against a two-line one and every tag sits on the bottom line */
thead th{padding:10px 6px;vertical-align:bottom;height:1px}
.ph{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;height:100%}
.ph .nm{margin-block:auto}
.ph .nm{border:0;background:transparent;padding:4px 6px;border-radius:8px;font-weight:800;font-size:1.05rem;max-width:100%;overflow-wrap:break-word;hyphens:auto;text-align:center;line-height:1.2}
.ph .tag{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;color:transparent}
th.active .tag{background:var(--accent);color:var(--on-accent)}
/* the tint lies over each row's own background, so the stripe runs through the sums too; plain rgba, since older iPhone web views skip color-mix */
#table th.me,#table td.me,#totbar td.me{background-image:linear-gradient(var(--stripe),var(--stripe))}
.cat{display:flex;flex-direction:column;gap:2px;min-width:0;width:100%;border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit}
.cat b{font-weight:700;text-decoration:underline dotted color-mix(in srgb,var(--muted) 60%,transparent);text-underline-offset:4px}
.cat small{font-size:.75rem;font-weight:400;color:var(--muted);overflow-wrap:anywhere}
td.cell{padding:0;height:48px}
td.cell button{position:relative;display:block;width:100%;height:48px;border:0;background:transparent;font-size:1.3rem;font-weight:800}
td.cell button:hover{background:var(--accent-soft)}
td.cell button.empty{color:var(--muted);font-weight:400;font-size:1rem}
td.cell button.zero{color:var(--muted);font-weight:400;font-size:1rem}
tr.sum td{background:var(--bg);font-weight:800}
tr.sum td.v{font-size:1.1rem}
.v .need{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-top:2px}
.v.got{color:var(--ok)}
tr.total td{font-family:var(--display);font-size:1.2rem;background:var(--accent-soft);padding-block:12px}
/* a copy of the total row fixed to the bottom of the screen while the table's own row is below it (see drawTotbar);
   a sticky table row shook and slipped on iPhones on a fast flick */
#totbar{position:fixed;bottom:0;z-index:4;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg)}
#totbar .card{box-shadow:0 -4px 14px rgba(0,0,0,calc(.1*var(--fade,1)))}
html.tgfull #totbar{padding-bottom:calc(6px + var(--tg-bottom,0px))}
tr.total td.lead{color:var(--win)}
tr.section td{padding:10px 12px 6px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--paper)}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 18px;border-radius:16px;background:var(--win-soft);border:1px solid var(--win)}
.banner strong{font-family:var(--display);font-size:1.1rem;font-weight:600}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--danger-soft)}
.confirm span{flex:1 1 220px}

h2{font-family:var(--display);font-size:1.05rem;margin:0;font-weight:600}
section{display:flex;flex-direction:column;gap:10px}
.tally{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--rule);font-weight:700}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--rule)}
.hist li:last-child{border-bottom:0}
.hist .date{font-size:.8rem;color:var(--muted)}
.hist .res{font-variant-numeric:tabular-nums;font-weight:600;min-width:0;overflow-wrap:anywhere}
.hist .res b{color:var(--win)}

.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--paper);border:1px solid var(--rule);align-self:flex-start}
.tabs button{min-height:44px;padding:0 20px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.view{display:flex;flex-direction:column;gap:24px}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pcard{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pcard h3{margin:0;font-family:var(--display);font-size:1.05rem;font-weight:600;overflow-wrap:anywhere}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-family:var(--display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.streak{align-self:flex-start;font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--win-soft);color:var(--win)}
.records{list-style:none;margin:0;padding:0}
.records li{display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--rule)}
.records li:last-child{border-bottom:0}
.records b{font-variant-numeric:tabular-nums}
.records li.me{background:var(--accent-soft)}
.scroll{overflow-x:auto}
table.avg td,table.avg th{padding:8px 12px;font-size:.92rem}
table.avg td+td{font-weight:700}
table.avg td.hi{color:var(--ok)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ach{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--paper);border:1px solid var(--rule);min-width:0}
.ach .badge{flex:none;display:grid;place-items:center;width:52px;height:44px;padding:0 4px;border-radius:12px;letter-spacing:-.02em;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:.72rem;text-align:center;line-height:1}
#stats{display:flex;flex-direction:column;gap:24px}
#banner:empty,#actions:empty,#remind:empty,#dice:empty,#net:empty{display:none}
.ach.off{background:transparent;border-style:dashed}
.ach.off b{color:var(--muted);font-weight:600}
.ach.off .badge{background:transparent;color:var(--muted);border:1.5px solid var(--rule)}
.ach b{display:block}
.ach small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.ach .who{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.ach .who span{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft)}
.ach .who span.no{display:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.statseg{margin-bottom:12px}
.seg button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--rule);background:var(--paper);font-weight:700}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.newach{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.newach p{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.newach .who{font-weight:800;margin-right:4px}
.newach p.muted{font-size:.8rem}
.achip{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--muted)}
.achip.new{background:var(--win);border-color:var(--win);color:var(--on-accent)}
.banner>div{min-width:0;flex:1 1 260px}
.remind{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--accent-soft)}
.hist li{cursor:pointer}
.hist li:hover{background:var(--bg)}
.hist .early{font-size:.72rem;font-weight:700;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:1px 8px;margin-left:6px}
.netbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--rule)}
.netbar>span:nth-child(2){flex:1;min-width:0}
.netbar .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--rule)}
.netbar .dot.on{background:var(--ok)}
.roomcode{font-size:2.4rem;font-weight:800;letter-spacing:.3em;padding-left:.3em!important;text-align:center;padding:8px 0;font-variant-numeric:tabular-nums}
.note{margin:0;padding:10px 12px;border-radius:12px;background:var(--win-soft);font-size:.9rem}
.sheet table.avg td,.sheet table.avg th{padding:6px 10px}
.sheet table.avg tr.t td{font-weight:800;background:var(--accent-soft)}
.toasts{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;width:min(420px,100%);padding:12px 14px;border-radius:16px;background:var(--paper);border:1px solid var(--rule);box-shadow:0 10px 30px color-mix(in srgb,#000 22%,transparent);cursor:pointer}
.toast .badge{flex:none;display:grid;place-items:center;width:52px;height:44px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:.72rem;line-height:1;text-align:center}
.toast small{display:block;color:var(--muted);font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.toast b{display:block}
.toast span.who{font-size:.85rem;color:var(--muted)}
.toast.first .badge{background:var(--win)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:tin .35s cubic-bezier(.2,.9,.3,1.3) both}
  .toast.out{animation:tout .25s ease-in both}
  @keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.96)}}
  @keyframes tout{to{opacity:0;transform:translateY(-12px)}}
}
/* the page colour behind the top half of the sticky panel (and a strip above it) keeps the table from showing through its upper rounded corners; the lower corners stay round over the table */
#dice{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg),var(--bg)) top/100% 50% no-repeat;box-shadow:0 -12px 0 var(--bg)}
.dicebar{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-radius:16px;background:var(--paper);border:1px solid var(--rule);box-shadow:0 6px 18px color-mix(in srgb,#000 10%,transparent)}
.dicehead{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.dicehead b{font-weight:800}
/* dice and the roll button share one row; the dice shrink to fit a phone */
.dicerow{--g:12px;display:flex;gap:var(--g);align-items:center}
.dies{display:flex;gap:var(--g);flex:0 1 auto;min-width:0;padding:6px 0 4px}
.die{position:relative;flex:0 1 auto;width:62px;min-width:0;aspect-ratio:1;padding:9px;border-radius:14px;border:2px solid var(--rule);background:var(--paper);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;box-shadow:0 3px 0 var(--rule);transition:transform .2s,box-shadow .2s}
.die i{width:10px;height:10px;border-radius:50%;background:var(--ink);visibility:hidden}
.die i.on{visibility:visible}
.die.blank i{visibility:hidden}
.die.held{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-5px);box-shadow:0 8px 0 color-mix(in srgb,var(--accent) 35%,transparent)}
.die:disabled{cursor:default}
/* a shaking die gets its own layer, so its rattle and face changes do not repaint the panel and the table under it;
   it glides from one jolt to the next over the time until the next one (set per jolt in animateRoll) */
.die.shaking{transition:transform 45ms ease-in-out;will-change:transform;box-shadow:0 8px 14px color-mix(in srgb,#000 18%,transparent)}
/* landing: a squash, a bounce and a ring that fades out */
.die.land{animation:land .42s cubic-bezier(.2,1.5,.4,1)}
.die.land::before{content:"";position:absolute;inset:-4px;border-radius:17px;border:2px solid var(--accent);animation:ring .5s ease-out forwards;pointer-events:none}
@keyframes land{0%{transform:scale(1.18) rotate(-6deg)}35%{transform:scale(1.08,.88)}65%{transform:scale(.96,1.05)}100%{transform:none}}
@keyframes ring{from{opacity:.8;transform:scale(.9)}to{opacity:0;transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.die.land,.die.land::before{animation:none}}
.dicebar.rolling .muted{visibility:hidden}
.dicebar.shake .dies{animation:shake .28s}
@keyframes shake{25%{transform:translateX(-4px) rotate(-1deg)}75%{transform:translateX(4px) rotate(1deg)}}
.dicebar.yatzy{animation:glow 1.6s ease-out;border-color:var(--win)}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--win) 70%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.yflash{display:inline-block;margin-left:12px;line-height:1;font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--win);letter-spacing:.04em;animation:ypop 1.4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes ypop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.dicebar.shake .dies,.dicebar.yatzy,.yflash{animation:none}}
/* the roll button is one more square in the row, the size of a die */
.rollbtn{flex:none;width:min(62px,calc((100% - 5 * var(--g)) / 6));aspect-ratio:1;min-height:0;padding:0;border-radius:14px;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.rollbtn svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.dnote b{color:var(--ink)}
.dhr{display:inline-flex;align-items:center;gap:10px}
.rbtn{border:1.5px solid var(--rule);background:var(--bg);border-radius:999px;width:34px;height:30px;font-size:1rem;line-height:1;padding:0}
.reacts{display:flex;justify-content:space-between;gap:6px}
.reacts button{flex:1;border:1.5px solid var(--rule);background:var(--bg);border-radius:12px;height:40px;font-size:1.3rem;padding:0}
.reactfly{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;transform:translateX(-50%);animation:rfly 2.6s ease-out forwards}
.rfe{font-size:4rem;line-height:1}
.rfn{font-size:.8rem;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--rule)}
@keyframes rfly{0%{opacity:0;transform:translate(-50%,30px) scale(.5)}12%{opacity:1;transform:translate(-50%,0) scale(1.1)}20%{transform:translate(-50%,0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-160px)}}
@media (prefers-reduced-motion:reduce){.reactfly{animation:rfade 2.6s forwards}@keyframes rfade{0%,80%{opacity:1}100%{opacity:0}}}
/* in a cell: a written score is plain bold; "+16" is what can be written; a ring marks the best of those */
td.cell button.sug{color:var(--accent);font-weight:600;font-size:1rem;opacity:.85}
td.cell button.sug::before,.lg.sug::before{content:"+"}
td.cell button.sug.z{color:var(--muted);font-weight:400;font-size:.9rem;opacity:.6}
td.cell button.sug.z::before{content:none}
td.cell button.sug.best,.lg.best{outline:2px solid var(--accent);outline-offset:-7px;border-radius:14px;font-weight:800;opacity:1}
td.cell button.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,30%{background:color-mix(in srgb,var(--accent) 30%,transparent)}}
@media (prefers-reduced-motion:reduce){td.cell button.flash{animation:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding:0 4px;font-size:.8rem;color:var(--muted)}
.legend:empty{display:none}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;font-style:normal;font-weight:700;color:var(--accent);border-radius:8px}
.lg.best{outline-offset:0;padding:0 6px}
.rulesbtn{border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.8rem;color:var(--muted)}
.sheet p{margin:0}
.rules{margin:0}
.rules dt{font-weight:800}
.rules dd{margin:2px 0 12px;color:var(--muted);font-size:.92rem}
.example{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.minidice{display:flex;gap:6px}
.die.mini{width:36px;height:36px;padding:5px;border-radius:9px;box-shadow:none;border-width:1.5px}
.die.mini i{width:6px;height:6px}
@media (max-width:520px){.die{padding:6px;border-radius:12px}.die i{width:7px;height:7px}.dicerow{--g:7px}.rollbtn{border-radius:12px}}

</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>

<div class="wrap">
  <header>
    <h1><span class="pip" aria-hidden="true"><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i></span>Яцзы</h1>

  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tgame" aria-selected="true">Партия</button>
    <button role="tab" id="tstats" aria-selected="false">Статистика</button>
  </nav>

  <div id="vgame" class="view">
    <div id="remind"></div>
    <div id="net"></div>

    <div class="row"><button class="btn" id="exp">Сохранить копию</button><label class="btn" for="imp">Восстановить из файла</label><input type="file" id="imp" accept=".json,application/json" hidden></div>
    <p class="muted" id="blast"></p>

  </div>

<div id="sheet"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
// rules, game state, storage and totals
const range=(a,b,s=1)=>{const r=[];for(let x=a;x<=b;x+=s)r.push(x);return r};
const UP=[1,2,3,4,5,6].map((n,i)=>({id:'u'+n,name:['Единицы','Двойки','Тройки','Четвёрки','Пятёрки','Шестёрки'][i],hint:'сумма '+['единиц','двоек','троек','четвёрок','пятёрок','шестёрок'][i],vals:range(0,5).map(k=>k*n),par:3*n}));
const LOW=[
  {id:'three',name:'Тройка',hint:'три одинаковых, сумма всех кубиков',vals:[0,...range(5,30)]},
  {id:'four',name:'Каре',hint:'четыре одинаковых, сумма всех кубиков',vals:[0,...range(5,30)]},
  {id:'small',name:'Малый стрит',hint:'четыре подряд',vals:[0,30]},
  {id:'large',name:'Большой стрит',hint:'пять подряд',vals:[0,40]},
  {id:'house',name:'Фулл-хаус',hint:'тройка + пара',vals:[0,25]},
  {id:'chance',name:'Шанс',hint:'сумма всех кубиков',vals:[0,...range(5,30)]},
  {id:'yatzy',name:'Яцзы',hint:'пять одинаковых',vals:[0,50]},
];
const ALL=[...UP,...LOW];
const JK={id:'joker',name:'Джокер',hint:'повторный Яцзы, один раз за игру; в другую клетку 0',vals:[0,100]};
const MAXP=4;
const uid=()=>Math.random().toString(36).slice(2,9);
// Russian plural: 1 ачивка, 2 ачивки, 5 ачивок
const plural=(n,one,few,many)=>{const a=n%10,b=n%100;return a===1&&b!==11?one:a>=2&&a<=4&&(b<12||b>14)?few:many};

let roster=[], game=null, history=[], ui={confirm:false}, store=null, net=null;
// how a finished game is shared to a chat; set by the GitHub Pages and Telegram versions
let shareVia=null;
// set inside Telegram when the bot is on: asks the player on turn to move
let nudgeVia=null;
// quick reactions in an online game; they float up on every screen in the room
const REACTS=['👍','😂','😱','😭','🔥','🎉'];
function showReact(name,e){const d=document.createElement('div');d.className='reactfly';d.innerHTML=`<span class="rfe">${e}</span><span class="rfn">${esc(name)}</span>`;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
// in an online room a device acts only for its own players
const mine=i=>!net||net.mine(i);

function normGame(g){
  if(!g||!Array.isArray(g.scores))return null;
  if(!g.players&&Array.isArray(g.names))g.players=g.names.map(n=>({id:uid(),name:n}));
  if(!Array.isArray(g.players)||g.players.length!==g.scores.length)return null;
  delete g.names;
  g.scores.forEach(s=>{delete s.pair;delete s.twopair;if(s.joker>100)s.joker=100});
  return g;
}
function newGameFor(players){const dice=!!lsGet('yatzy.dice');return {players:players.map(p=>({id:p.id,name:p.name})),scores:players.map(()=>({})),started:Date.now(),saved:false,dice,roll:dice?newRoll():null}}
function ensureRoster(g){if(!g)return;g.players.forEach(p=>{const r=roster.find(r=>r.id===p.id||r.name===p.name);if(r)p.id=r.id;else roster.push({id:p.id,name:p.name})})}

function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function load(){
  roster=lsGet('yatzy.roster')||[];
  const old=lsGet('yatzy.state');
  game=normGame(lsGet('yatzy.game'))||normGame(old);
  history=lsGet('yatzy.hist')||[];
  // an online game keeps other devices' players out of the local roster
  if(game&&!game.players.some(p=>p.dev))ensureRoster(game);
}

function totals(i){
  const s=game.scores[i];let up=0,low=0;
  UP.forEach(c=>{if(s[c.id]!=null)up+=s[c.id]});
  LOW.forEach(c=>{if(s[c.id]!=null)low+=s[c.id]});
  const par=UP.reduce((a,c)=>a+(s[c.id]!=null?s[c.id]-c.par:0),0);
  const upFilled=UP.filter(c=>s[c.id]!=null).length;
  const bonus=up>=63?50:0, jk=s.joker||0;
  return {up,bonus,low,jk,total:up+bonus+low+jk,par,upFilled,filled:ALL.filter(c=>s[c.id]!=null).length};
}
const done=()=>game&&game.players.every((_,i)=>totals(i).filled===ALL.length);
const over=()=>game&&(done()||!!game.ended);
function whoseTurn(){if(!game||over())return -1;const f=game.players.map((_,i)=>totals(i).filled);const m=Math.min(...f);return f.indexOf(m)}
const anyScore=()=>game&&game.scores.some(s=>Object.keys(s).length);

// also used inside attributes, so quotes are escaped too
// a finished game from a backup or another device: anything else is skipped, so it cannot break the history
const okSavedGame=g=>!!g&&typeof g.at==='number'&&Array.isArray(g.players)&&g.players.length>0&&g.players.every(p=>p&&typeof p.name==='string'&&p.name.length<=40&&Number.isFinite(p.total)
  &&(p.scores==null||typeof p.scores==='object'&&Object.values(p.scores).every(v=>v===null||Number.isFinite(v))));
// a player from a backup, the Telegram cloud or the claude.ai database: an id like uid() makes and a short name
const okPerson=r=>!!r&&typeof r.id==='string'&&/^[a-z0-9]{1,24}$/.test(r.id)&&typeof r.name==='string'&&r.name.trim().length>0&&r.name.length<=16;
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const $=id=>document.getElementById(id);
// a short vibration; inside Telegram its haptics are used, they also work on iPhone and iPad
let haptic=null;
function buzz(kind){try{if(haptic)return haptic(kind);navigator.vibrate&&navigator.vibrate(kind==='yatzy'?[40,60,40,60,120]:15)}catch(e){}}

// the score table, entering scores, players, past games and the two tabs
function render(){
  const tb=$('table');
  if(!game){
    tb.innerHTML=`<tbody><tr><td style="padding:28px 20px;text-align:center"><p style="margin:0 0 14px;font-weight:700">Выберите, кто играет, и начните партию</p><div class="row" style="justify-content:center"><button class="btn primary" id="start0">Выбрать игроков</button>${window.openOnline?'<button class="btn" id="onl0">Играть онлайн</button>':''}</div></td></tr></tbody>`;
    $('start0').onclick=openSetup;if($('onl0'))$('onl0').onclick=window.openOnline;$('banner').innerHTML='';$('actions').innerHTML='';$('legend').innerHTML='';drawTotbar();renderHist();keepAwake();window.onAfterRender&&window.onAfterRender();return;
  }
  const n=game.players.length,T=game.players.map((_,i)=>totals(i)),turn=whoseTurn();
  const catW=n>=4?'30%':n===3?'34%':'40%';
  // a light stripe down your own column (online) or the column on turn (one device), so it is not lost while scrolling
  const me=i=>(net?net.own(i):i===turn)?' me':'';
  // in a room your own column comes first and the others follow in turn order, so your stripe always stands at the same place
  const first=net?Math.max(0,game.players.findIndex((_,i)=>net.own(i))):0,cols=range(0,n-1).map(k=>(first+k)%n);
  let h=`<colgroup><col style="width:${catW}">${game.players.map(()=>'<col>').join('')}</colgroup><thead><tr><th><button class="rulesbtn" data-help="all">Правила</button></th>`;
  h+=cols.map(i=>[game.players[i],i]).map(([p,i])=>`<th class="${turn===i?'active':''}${me(i)}"><div class="ph"><button class="nm" data-ren="${i}" ${net?'disabled':''} aria-label="Переименовать ${esc(p.name)}">${esc(p.name)}</button><span class="tag">ходит</span></div></th>`).join('')+'</tr></thead><tbody>';
  const sug=turn>=0?suggestions(turn):null,topSug=sug?Math.max(...Object.values(sug)):0;
  // a score that has just come in flashes once
  const lm=lastMove(),L=(game.log||[]).length,fresh=seen.game===game.started&&L>seen.n?lm:null;seen.game=game.started;seen.n=L;
  const cell=(i,c)=>{const v=game.scores[i][c.id];
    // only cells that score get a suggestion; a cell worth 0 stays a plain empty cell and a tap opens the picker,
    // except right after the joker, when a 0 in any free cell is exactly what is due
    if(v==null&&i===turn&&sug&&sug[c.id]!=null&&(sug[c.id]>0||game.roll&&game.roll.jokerTaken)&&mine(i)){const x=sug[c.id];
      return `<td class="cell${me(i)}"><button class="sug${x===0?' z':''}${x>0&&x===topSug?' best':''}" data-p="${i}" data-c="${c.id}" data-s="${x}" aria-label="${esc(game.players[i].name)}: ${c.name}, записать ${x}">${x}</button></td>`}
    const cls=(v==null?'empty':v===0?'zero':'')+(fresh&&fresh.i===i&&fresh.c.id===c.id?' flash':'');
    // with dice on one device, someone else's empty cell waits for their turn; a written one can still be corrected
    const shut=net||game.dice&&v==null&&i!==turn;
    return `<td class="cell${me(i)}"><button class="${cls}" data-p="${i}" data-c="${c.id}" ${shut?'disabled':''} aria-label="${esc(game.players[i].name)}: ${c.name}${v===0?', вычеркнуто':''}">${v==null?'—':v===0?'✕':v}</button></td>`};
  const row=c=>`<tr><td><button class="cat" data-help="${c.id}"><b>${c.name}</b><small>${c.hint}</small></button></td>${cols.map(i=>cell(i,c)).join('')}</tr>`;
  const need=t=>{if(t.bonus||!t.upFilled)return '';return t.par>=0?`<span class="need">с запасом +${t.par}</span>`:`<span class="need">отстаёт на ${-t.par}</span>`};
  const sec=t=>`<tr class="section"><td colspan="${n+1}">${t}</td></tr>`;
  h+=sec('Верхняя часть')+UP.map(row).join('');
  h+=`<tr class="sum"><td>Сумма</td>${cols.map(i=>[T[i],i]).map(([t,i])=>`<td class="v${me(i)}">${t.up}</td>`).join('')}</tr>`;
  h+=`<tr class="sum"><td><button class="cat" data-help="bonus"><b>Бонус</b><small>50 очков при 63+</small></button></td>${cols.map(i=>[T[i],i]).map(([t,i])=>`<td class="v${t.bonus?' got':''}${me(i)}">${t.bonus?'+50':'0'}${need(t)}</td>`).join('')}</tr>`;
  h+=sec('Нижняя часть')+LOW.map(row).join('')+row(JK);
  const best=Math.max(...T.map(t=>t.total)),leaders=T.filter(t=>t.total===best).length;
  h+=`<tr class="total"><td>Итого</td>${cols.map(i=>[T[i],i]).map(([t,i])=>`<td class="${t.total===best&&best>0&&leaders===1?'lead':''}${me(i)}">${t.total}</td>`).join('')}</tr></tbody>`;
  tb.innerHTML=h;drawTotbar();
  $('legend').innerHTML=over()||history.length>=5?'':`${game.dice?'<span><i class="lg sug">16</i>можно записать</span><span><i class="lg best">25</i>лучший вариант</span>':''}<span>Нажмите на название, чтобы увидеть правило</span>`;

  const bn=$('banner');
  if(over()){
    const order=T.map((t,i)=>({t:t.total,name:game.players[i].name})).sort((a,b)=>b.t-a.t);
    const msg=leaders>1?`Ничья, ${order.map(o=>o.t).join(' : ')}`:`Победа: ${esc(order[0].name)}, ${order.map(o=>o.t).join(' : ')}`;
    const na=(game.newAch||[]).filter(x=>x.list.length);
    const achHtml=na.length?`<div class="newach">${na.map(x=>`<p><span class="who">${esc(x.name)}</span>${x.list.map(a=>`<span class="achip${a.first?' new':''}">${a.name}</span>`).join('')}</p>`).join('')}${na.some(x=>x.list.some(a=>a.first))?'<p class="muted">Закрашены новые ачивки</p>':''}</div>`:'';
    bn.innerHTML=`<div class="banner"><div><strong>${msg}</strong>${game.ended&&!done()?'<p class="muted" style="margin-top:4px">Партия закончена досрочно.</p>':''}${achHtml}</div><div class="row">${shareVia?'<button class="btn" id="shareres">Поделиться</button>':''}<button class="btn primary" id="again">${net?'Ещё партию':'Новая игра'}</button></div></div>`;
    $('again').onclick=net?net.again:openSetup;
    if($('shareres'))$('shareres').onclick=()=>shareVia(resultText());
  } else bn.innerHTML='';

  const ac=$('actions');
  if(ui.confirm){
    ac.innerHTML=`<div class="confirm"><span>Игра не закончена. Начать заново? Текущий счёт не попадёт в историю.</span><button class="btn danger" id="yes">Да, новая игра</button><button class="btn" id="no">Отмена</button></div>`;
    $('yes').onclick=()=>{ui.confirm=false;render();openSetup()};
    $('no').onclick=()=>{ui.confirm=false;render()};
  } else if(ui.finish){
    ac.innerHTML=`<div class="confirm"><span>Закончить партию сейчас? Она попадёт в историю с текущим счётом, пустые клетки не считаются. Ачивки за неё не начисляются.</span><button class="btn danger" id="fyes">Закончить</button><button class="btn" id="fno">Отмена</button></div>`;
    $('fyes').onclick=()=>{ui.finish=false;game.ended=true;archive();saveGame();render()};
    $('fno').onclick=()=>{ui.finish=false;render()};
  } else if(net){net.actions(ac)
  } else {
    // reordering in the middle of a dice turn would hand the roll to another player
    const midTurn=game.dice&&game.roll&&(game.roll.n>0||game.roll.jokerTaken);
    const last=(game.log||[]).slice(-1)[0],lp=last&&game.players.find(p=>p.id===last.pid),lc=last&&[...ALL,JK].find(c=>c.id===last.cid);
    // on screen: undo, online and «Ещё»; the rest waits in the «Ещё» sheet, so ending a game early takes a deliberate tap
    ac.innerHTML=`<div class="row">${lp&&lc?`<button class="btn" id="undo">↶ Отменить: ${esc(lp.name)}, ${lc.name}</button>`:''}${window.openOnline?'<button class="btn" id="onl">Играть онлайн</button>':''}${over()?'':'<button class="btn" id="more">Ещё</button>'}</div>`;
    if($('onl'))$('onl').onclick=window.openOnline;
    if($('undo'))$('undo').onclick=undo;
    if($('more'))$('more').onclick=()=>openMore(n,midTurn);
  }
  renderDice();renderHist();keepAwake();
  window.onAfterRender&&window.onAfterRender();
}

// the «Ещё» sheet: new game, order, dice or manual entry, and ending the game early
function openMore(n,midTurn){
  sheet.open(`<h3>Партия</h3><div class="more">
    <button class="btn" id="ng">Новая игра</button>
    ${midTurn?'':`<button class="btn" id="sw">${n===2?'Поменять местами':'Сдвинуть порядок'}</button>`}
    <button class="btn" id="dmode">${game.dice?'Ввод вручную':'Кубики на экране'}</button>
    ${anyScore()?'<button class="btn danger" id="fin">Закончить досрочно</button>':''}</div>`);
  const then=f=>()=>{sheet.close();f();render();if(ui.confirm||ui.finish)$('actions').scrollIntoView({behavior:'smooth',block:'center'})};
  $('ng').onclick=then(()=>{if(!anyScore())openSetup();else ui.confirm=true});
  if($('sw'))$('sw').onclick=then(()=>{game.players.push(game.players.shift());game.scores.push(game.scores.shift());saveGame()});
  $('dmode').onclick=then(()=>{game.dice=!game.dice;if(game.dice&&!game.roll)game.roll=newRoll();lsSet('yatzy.dice',game.dice);saveGame()});
  if($('fin'))$('fin').onclick=then(()=>{ui.finish=true});
}

// keep the iPad screen on while a game is in progress
let wl=null;
async function keepAwake(){
  try{
    if(game&&!over()&&document.visibilityState==='visible'){if(!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}
    else if(wl){await wl.release();wl=null}
  }catch(e){wl=null}
}
document.addEventListener('visibilitychange',keepAwake);


function setScore(i,cid,v){
  const beforeSc={...game.scores[i]};
  const turnBefore=whoseTurn();
  const entry={pid:game.players[i].id,cid,prev:game.scores[i][cid],roll:game.roll?JSON.parse(JSON.stringify(game.roll)):null};
  // the joker stands only on a Yatzy of 50: correcting that cell takes the joker with it (undo brings both back)
  if(cid==='yatzy'&&v!==50&&game.scores[i].joker!=null){entry.jk=game.scores[i].joker;delete game.scores[i].joker}
  (game.log=game.log||[]).push(entry);
  if(game.log.length>200)game.log.shift();
  if(v==null)delete game.scores[i][cid];else game.scores[i][cid]=v;
  if(v!=null)checkLive(i,beforeSc);
  // in dice mode a score for the player on turn ends the turn, except the joker, after which a 0 is still due
  if(game.dice&&v!=null&&i===turnBefore){if(cid==='joker'&&game.roll)game.roll.jokerTaken=true;else game.roll=newRoll()}
  // clearing someone else's cell can move the turn to them: the roll must not follow
  else if(game.dice&&whoseTurn()!==turnBefore)game.roll=newRoll();
  changed();
}
function undo(){
  const e=(game.log||[]).pop();if(!e)return;
  const i=game.players.findIndex(p=>p.id===e.pid);
  if(i>=0){if(e.prev==null)delete game.scores[i][e.cid];else game.scores[i][e.cid]=e.prev;if(e.jk===100)game.scores[i].joker=100}
  if('roll' in e)game.roll=e.roll;
  if(game.saved)unarchive();
  saveGame();render();
}

function renderHist(){
  if(!$('vstats').hidden)renderStats();
  const list=[...history].sort((a,b)=>b.at-a.at);
  const counted=list.filter(g=>!g.early),wins={};counted.forEach(g=>{if(g.winner!=null)wins[g.winner]=(wins[g.winner]||0)+1});
  const draws=counted.filter(g=>g.winner==null).length;
  $('tally').innerHTML=list.length?Object.entries(wins).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="chip">${esc(k)}: ${v}</span>`).join('')+(draws?`<span class="chip">Ничьи: ${draws}</span>`:''):'';
  $('hist').innerHTML=list.length?list.slice(0,100).map(g=>{
    const d=new Date(g.at).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
    const r=g.players.map(p=>p.name===g.winner?`<b>${esc(p.name)} ${p.total}</b>`:`${esc(p.name)} ${p.total}`).join(' · ');
    return `<li data-at="${g.at}" tabindex="0" role="button"><span class="res">${r}${g.early?'<span class="early">досрочно</span>':''}</span><span class="date">${d}</span></li>`}).join(''):'<li><span class="muted">Здесь появятся сыгранные партии с датой и счётом.</span></li>';
}

// a sheet at the bottom of a phone can be pulled down to close: it follows the finger while its content is scrolled to the top,
// and closes past a third of its height or on a quick flick, otherwise springs back
function pullDown(el){
  let y0=null,dy=0,t0=0;
  const back=()=>{el.style.transition='transform .2s ease';el.style.transform=''};
  el.addEventListener('touchstart',e=>{y0=e.touches.length===1&&el.scrollTop<=0&&!matchMedia('(min-width:700px)').matches?e.touches[0].clientY:null;dy=0;t0=performance.now()},{passive:true});
  el.addEventListener('touchmove',e=>{
    if(y0==null)return;dy=e.touches[0].clientY-y0;
    if(dy<=0){if(!el.style.transform)y0=null;else el.style.transform='';return}
    if(e.cancelable)e.preventDefault();
    el.style.transition='none';el.style.transform=`translateY(${dy}px)`;
  },{passive:false});
  el.addEventListener('touchend',()=>{
    if(y0==null)return;y0=null;if(dy<=0)return back();
    if(dy>el.offsetHeight/3||dy>40&&dy/(performance.now()-t0)>.6){el.style.transition='transform .18s ease-in';el.style.transform='translateY(100%)';setTimeout(()=>{if($('sheet').contains(el))sheet.close()},180)}
    else back();
  });
  el.addEventListener('touchcancel',()=>{if(y0!=null){y0=null;back()}});
}

  const r=game.dice&&game.roll,onTurn=r&&cur==null&&i===whoseTurn();

function renamePlayer(id,name){
  name=name.trim().slice(0,16);
  if(!name)return 'Введите имя';
  if(roster.some(r=>r.id!==id&&r.name.toLowerCase()===name.toLowerCase()))return 'Игрок с таким именем уже есть';
  let r=roster.find(x=>x.id===id);
  const gp=game&&game.players.find(x=>x.id===id);
  if(!r&&gp){r={id,name:gp.name};roster.push(r)}
  if(!r)return 'Игрок не найден';
  const old=r.name;if(old===name)return null;
  r.name=name;if(gp)gp.name=name;
  history.forEach(g=>{let hit=false;
    g.players.forEach(p=>{if(p.id===id||p.name===old){p.name=name;p.id=id;hit=true}});
    if(hit){if(g.winner===old)g.winner=name;store&&store.updateGame&&store.updateGame(g)}});
  if(statFilter===old)statFilter=name;
  lsSet('yatzy.hist',history);saveRoster();if(game)saveGame();render();
  return null;
}

// the total row, copied into a bar fixed to the bottom of the screen while the table's own total row is further down;
// the copy keeps the table's column widths, so its numbers stand under their columns.
// The bar goes away only when the real row has come up to exactly where the copy stands, so one replaces the other
// without a jump; its shadow fades out over the last stretch before that
let totGap=0,totRaf=0;
function drawTotbar(){
  let bar=$('totbar');if(!bar){bar=document.createElement('div');bar.id='totbar';bar.hidden=true;document.body.appendChild(bar)}
  const row=document.querySelector('#table tr.total');if(!row){bar.hidden=true;return}
  bar.innerHTML=`<div class="card"><table>${$('table').querySelector('colgroup').outerHTML}<tbody>${row.outerHTML}</tbody></table></div>`;
  totGap=0;placeTotbar();syncTotbar();
}
function placeTotbar(){const bar=$('totbar'),c=$('table').parentElement.getBoundingClientRect();if(bar&&c.width){bar.style.left=c.left+'px';bar.style.width=c.width+'px'}}
function syncTotbar(){
  totRaf=0;const bar=$('totbar'),row=document.querySelector('#table tr.total');if(!bar)return;
  if(!row||$('vgame').hidden||!row.offsetHeight){bar.hidden=true;return}
  // how far the copy's row ends above the bottom of the screen (bottoms, as the real row's top edge runs through the line above it), measured once while the bar is shown
  if(!totGap){const was=bar.hidden;bar.style.visibility='hidden';bar.hidden=false;totGap=innerHeight-bar.querySelector('tr').getBoundingClientRect().bottom;bar.hidden=was;bar.style.visibility=''}
  const d=row.getBoundingClientRect().bottom-(innerHeight-totGap);
  bar.hidden=d<=.5;
  if(!bar.hidden)bar.style.setProperty('--fade',Math.min(1,d/48).toFixed(2));
}
const queueTotbar=()=>{if(!totRaf)totRaf=requestAnimationFrame(syncTotbar)};
addEventListener('scroll',queueTotbar,{passive:true});
addEventListener('resize',()=>{totGap=0;placeTotbar();queueTotbar()});

function archive(){
  const T=game.players.map((_,i)=>totals(i)),best=Math.max(...T.map(t=>t.total)),w=T.filter(t=>t.total===best);
  const g={at:Date.now(),started:game.started,players:game.players.map((p,i)=>({id:p.id,name:p.name,total:T[i].total,scores:{...game.scores[i]}})),
    winner:w.length>1?null:game.players[T.findIndex(t=>t.total===best)].name};
  if(game.ended&&!done())g.early=true;
  const before=computeStats();
  game.saved=true;game.savedAt=g.at;history.push(g);lsSet('yatzy.hist',history);
  const after=computeStats();
  game.newAch=after.players.filter(p=>g.players.some(x=>x.name===p.name)).map(p=>{const b=before.players.find(x=>x.name===p.name);
    return {name:p.name,list:ACH.filter(a=>p.ach[a.id]&&(!b||!b.ach[a.id]||b.ach[a.id].n<p.ach[a.id].n)).map(a=>({id:a.id,name:a.name,first:!b||!b.ach[a.id]}))}});
  // pop up first-time ones not shown during the game; all of the game's achievements are listed under the result
  const pend=[];game.newAch.forEach(x=>x.list.forEach(a=>{if(a.first&&!((game.shown||{})[x.name]||[]).includes(a.id))pend.push({a:ACH.find(z=>z.id===a.id),name:x.name,first:true})}));
  // several at once make one card instead of a stack over the result
  if(pend.length===1)toastLater(pend[0].a,pend[0].name,true);
  else if(pend.length)toastLater({badge:'+'+pend.length,label:'Новые ачивки',name:`${pend.length} ${plural(pend.length,'новая ачивка','новые ачивки','новых ачивок')}`,desc:'список под итогом партии'},[...new Set(pend.map(x=>x.name))].join(', '),true);
  store&&store.addGame(g);renderHist();
}
function unarchive(){
  if(game.savedAt)deleteGame(game.savedAt);
  game.saved=false;game.savedAt=null;game.newAch=null;game.ended=false;
}
function deleteGame(at){
  const g=history.find(x=>x.at===at);if(!g)return;
  history=history.filter(x=>x!==g);lsSet('yatzy.hist',history);
  store&&store.deleteGame&&store.deleteGame(g);
  // the current game stays marked as handled so it is not archived again
  if(game&&game.savedAt===at){game.savedAt=null;game.newAch=null;saveGame()}
  renderHist();
}

  const d=new Date(g.at).toLocaleString('ru-RU',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const up=p=>UP.reduce((a,c)=>a+(p.scores[c.id]||0),0);
  const cellv=v=>v==null?'—':v;
  let armed=false;

// on-screen dice: up to three rolls per turn, tap a die to keep it
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const newRoll=()=>({dice:[0,0,0,0,0],held:[false,false,false,false,false],n:0,jokerTaken:false});
// fair die: crypto random bytes, values 252..255 are re-drawn so every face has exactly 1/6
const rnd6=()=>{try{const a=new Uint8Array(1);do crypto.getRandomValues(a);while(a[0]>=252);return 1+a[0]%6}catch(e){return 1+Math.floor(Math.random()*6)}};
function scoreFor(cid,d){
  const cnt=[0,0,0,0,0,0,0];d.forEach(x=>cnt[x]++);
  const sum=d.reduce((a,b)=>a+b,0),mx=Math.max(...cnt),has=n=>cnt[n]>0;
  const run=(a,b)=>{for(let k=a;k<=b;k++)if(!has(k))return false;return true};
  if(cid[0]==='u'){const n=+cid[1];return n*cnt[n]}
  switch(cid){
    case 'three':return mx>=3?sum:0;
    case 'four':return mx>=4?sum:0;
    case 'small':return run(1,4)||run(2,5)||run(3,6)?30:0;
    case 'large':return run(1,5)||run(2,6)?40:0;
    case 'house':return cnt.includes(3)&&cnt.includes(2)?25:0;
    case 'chance':return sum;
    case 'yatzy':return mx===5?50:0;
  }
  return null;
}
function suggestions(i){

  ALL.forEach(c=>{if(sc[c.id]==null)out[c.id]=r.jokerTaken?0:scoreFor(c.id,r.dice)});
  if(sc.joker==null&&!r.jokerTaken&&isY&&sc.yatzy===50)out.joker=100;
  return out;
}

// the result is drawn and saved at once; the animation only reveals it:
// free dice rattle in place, calm down and slam onto the rolled face in random order
let rolling=false;
function setFace(el,v){el.querySelectorAll('i').forEach((p,q)=>p.classList.toggle('on',PIPS[v].includes(q)));el.classList.remove('blank')}
function rollDice(){
  const r=game.roll;if(rolling||!r||r.n>=3||r.jokerTaken||!mine(whoseTurn()))return;
  const free=r.dice.map((_,k)=>!r.held[k]||!r.n);
  if(!r.n)r.held=r.held.map(()=>false);
  free.forEach((f,k)=>{if(f)r.dice[k]=rnd6()});
  r.n++;saveGame();
  animateRoll(free);
}
// also shows a roll made on another device
function animateRoll(free){
  const r=game.roll,els=[...document.querySelectorAll('.die')];
  if(rolling||els.length!==5||$('vgame').hidden){render();return}
  const quick=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const bar=document.querySelector('.dicebar');
  const order=free.map((f,k)=>f?k:-1).filter(k=>k>=0);
  rolling=true;$('roll').disabled=true;els.forEach(d=>d.disabled=true);
  if(r.n>=3)els.forEach(d=>d.classList.remove('held'));
  bar.classList.add('rolling');bar.classList.remove('shake');void bar.offsetWidth;if(!quick)bar.classList.add('shake');
  const span=quick?0:1200+Math.random()*1200,stopAt={},next={},face={};
  order.forEach(k=>{stopAt[k]=quick?0:600+Math.random()*(span-600);els[k].classList.remove('held','land');els[k].classList.add('shaking')});
  const t0=performance.now(),j=a=>(Math.random()*2-1)*a;
  const tick=now=>{
    const t=now-t0;
    order.forEach(k=>{
      const d=els[k];if(!d.classList.contains('shaking'))return;
      if(t>=stopAt[k]){d.classList.remove('shaking');d.style.transitionDuration='';d.style.transform='';setFace(d,r.dice[k]);void d.offsetWidth;d.classList.add('land');buzz('land');return}
      const left=(stopAt[k]-t)/stopAt[k],gap=left>.6?45:left>.3?85:150;
      if(!next[k]||now>=next[k]){
        // rattle: random offset and tilt, strong at first and calmer towards the stop
        const a=3+9*left;d.style.transitionDuration=gap+'ms';d.style.transform=`translate3d(${j(a)}px,${j(a)-a*.6}px,0) rotate(${j(8+22*left)}deg) scale(${1+.06*left})`;
        let f=rnd6();if(f===face[k])f=f%6+1;face[k]=f;setFace(d,f);next[k]=now+gap;
      }
    });
    if(t<(quick?0:Math.max(...Object.values(stopAt),0))+450)requestAnimationFrame(tick);
    else{
      rolling=false;
      const yz=r.dice.every(v=>v===r.dice[0]);
      render();
      if(yz){const b=document.querySelector('.dicebar');if(b){b.classList.add('yatzy');b.querySelector('.dicehead').firstElementChild.insertAdjacentHTML('beforeend','<span class="yflash">Яцзы!</span>');buzz('yatzy')}}
    }
  };
  requestAnimationFrame(tick);
}

function liveCtx(sc){const up=UP.reduce((a,c)=>a+(sc[c.id]||0),0),low=LOW.reduce((a,c)=>a+(sc[c.id]||0),0);return {sc,up,low,p:{total:0},s:{}}}

function computeStats(){
  // a game finished early stays in the list of past games but counts nowhere: not in games, wins, averages, records or achievements
  const games=history.filter(g=>!g.early).sort((a,b)=>a.at-b.at),P={},rec={best:null,margin:null,worst:null};
  const get=n=>P[n]||(P[n]={name:n,games:0,wins:0,sum:0,best:0,worst:Infinity,bonus:0,yatzy:0,joker:0,zeros:{},cat:{},streak:0,bestStreak:0,ach:{},last:[],lossRun:0,run200:0,days:{}});
  games.forEach(g=>{
    const sorted=[...g.players].sort((a,b)=>b.total-a.total);
    const margin=sorted.length>1?sorted[0].total-sorted[1].total:0;
    if(g.winner&&(!rec.margin||margin>rec.margin.v))rec.margin={v:margin,who:g.winner,at:g.at};
    g.players.forEach(p=>{
      const s=get(p.name),sc=p.scores||{},won=g.winner===p.name,prevBest=s.best,lossRun=s.lossRun;
      const up=UP.reduce((a,c)=>a+(sc[c.id]||0),0),zeros=ALL.filter(c=>sc[c.id]===0).length;
      s.games++;s.sum+=p.total;s.best=Math.max(s.best,p.total);s.worst=Math.min(s.worst,p.total);s.last.push(won);
      if(up>=63)s.bonus++;if(sc.yatzy===50)s.yatzy++;if(sc.joker===100)s.joker++;
      ALL.forEach(c=>{if(sc[c.id]==null)return;(s.cat[c.id]=s.cat[c.id]||[]).push(sc[c.id]);if(sc[c.id]===0)s.zeros[c.id]=(s.zeros[c.id]||0)+1});
      (s.cat.joker=s.cat.joker||[]).push(sc.joker||0);
      if(won){s.wins++;s.streak++;s.bestStreak=Math.max(s.bestStreak,s.streak);s.lossRun=0}else{s.streak=0;if(g.winner)s.lossRun++}
      s.run200=p.total>=200?s.run200+1:0;
      const dk=new Date(g.at).toDateString();s.days[dk]=(s.days[dk]||0)+1;
      if(!rec.best||p.total>rec.best.v)rec.best={v:p.total,who:p.name,at:g.at};
      if(!rec.worst||p.total<rec.worst.v)rec.worst={v:p.total,who:p.name,at:g.at};
      const low=LOW.reduce((a,c)=>a+(sc[c.id]||0),0),top=sorted[0].total;
      const c={p,sc,up,low,won,margin,zeros,s,prevBest,lossRun,top,behind:top-p.total,draw:!g.winner&&g.players.length>1,hour:new Date(g.at).getHours(),dayN:s.days[dk]};
      ACH.forEach(a=>{if(a.t(c)){const r=s.ach[a.id]||(s.ach[a.id]={n:0,first:g.at});r.n++}});
    });
  });
  return {players:Object.values(P).sort((a,b)=>b.wins-a.wins||b.games-a.games),rec,count:games.length};
}

const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const fmt=x=>Math.round(x).toLocaleString('ru-RU');
const pct=(a,b)=>b?Math.round(100*a/b)+'%':'—';

function renderStats(){
  const st=computeStats(),el=$('stats');
  if(!st.count){
    el.innerHTML=`<div class="card" style="padding:20px"><p style="margin:0 0 6px;font-weight:700">Статистика появится после первой законченной партии</p><p class="muted">Здесь будут победы, средний счёт, рекорды и средние очки по каждой клетке. Ниже все ачивки, которые можно открыть.</p></div>`+achGrid(st);
    return;
  }

function bindRoomList(){

    const code=b.dataset.room;$('nmsg')&&($('nmsg').textContent='Подключаюсь…');
    try{
      if(net)await leaveRoom();

// joining: the local game waits on the side and comes back after leaving the room
async function enterRoom(code){
  keepRoom(code,null);
  if(!net&&!lsGet('yatzy.online')){lsSet('yatzy.offgame',game&&!game.players.some(p=>p.dev)?game:null);game=null;lsSet('yatzy.game',null)}
  lsSet('yatzy.online',{code});
  if(net)net.offs.forEach(f=>f&&f());
  net=makeNet(code);const me=net;render();
  try{
    const b=await backend();if(net!==me)return;
    me.offs.push(b.connected(c=>{me.connected=c;if(c)b.setOn(code,inApp).catch(()=>{});if(net===me)render()}));
    me.offs.push(b.watch(code,v=>{if(net===me)me.apply(v)}));
    me.offs.push(b.watchOn(code,v=>{me.on=v;if(net===me){renderNet();if($('roomsheet'))redrawRoom()}}));
  }catch(e){if(net===me){me.error=errCode(e)||true;render()}}
}
const errCode=e=>e&&typeof e.code==='string'?e.code:'';
const netErr=e=>e&&e.msg||'Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.'+(errCode(e)?' ('+errCode(e)+')':'');

async function leaveRoom(gone){
  const me=net;if(!me)return;
  const st=me.state;keepRoom(me.code,!gone&&st&&st.game&&!finished(st.game)&&st.players.some(p=>p.dev===DEV)?st:null);
  net=null;me.offs.forEach(f=>f&&f());
  lsSet('yatzy.online',null);
  game=normGame(lsGet('yatzy.offgame'));lsSet('yatzy.offgame',null);lsSet('yatzy.game',game);
  sheet.close();ui.confirm=false;render();
  if(gone){toast({badge:'✕',label:'Онлайн',name:'Комната закрыта',desc:'все игроки вышли'},'Онлайн',false);return}
  try{
    const b=await backend();await b.setOn(me.code,false);
    // players leave the room between games; the last one out removes it
    const s=await txRoom(me.code,s=>{if(s.game&&!finished(s.game))return;s.players=s.players.filter(p=>p.dev!==DEV);if(s.game){s.prev=s.game;s.game=null}return s});
    if(s&&!s.players.length)await b.remove(me.code);
  }catch(e){}
}
// ending a room game early takes every device in it: one proposes, each of the others agrees or refuses
const gameDevs=s=>[...new Set(s.game.players.map(p=>p.dev))];
const devName=(s,dev)=>(s.game.players.find(p=>p.dev===dev)||{name:'Игрок'}).name;
const stopOf=s=>s.stop&&s.game&&!finished(s.game)&&s.stop.g===s.game.started?s.stop:null;
function voteStop(yes){
  const code=net&&net.code;if(!code)return;
  // written without this device's mark, so its own echo is applied here too and the game ends on every screen alike
  txRoom(code,s=>{
    if(!s.game||finished(s.game))return;
    const v=stopOf(s)||(yes?{by:DEV,yes:[],g:s.game.started}:null);if(!v)return;
    if(!yes)delete s.stop;
    else{if(!v.yes.includes(DEV))v.yes.push(DEV);if(gameDevs(s).every(d=>v.yes.includes(d))){s.game.ended=true;delete s.stop}else s.stop=v}
    delete s.by;s.rev=(s.rev||0)+1;return s;
  }).catch(()=>toast({badge:'!',label:'Онлайн',name:'Не получилось',desc:'нет связи с комнатой'},'Онлайн',false));
}
async function startRoomGame(){
  if(!net)return;
  const code=net.code;
  await txRoom(code,s=>{
    if(s.game&&!finished(s.game))return;
    if(s.players.length<2)return;
    // each new game in the room starts with the next player
    const k=(s.round||0)%s.players.length,ps=s.players.slice(k).concat(s.players.slice(0,k));
    s.round=(s.round||0)+1;
    if(s.game)s.prev=s.game;
    delete s.stop;
    s.game={players:ps.map(p=>({id:p.id,name:p.name,dev:p.dev})),scores:ps.map(()=>({})),started:Date.now(),dice:true,roll:newRoll(),log:[]};
    s.by=DEV;s.rev=(s.rev||0)+1;return s;
  }).then(s=>{if(s&&s.game)botNote(code)}).catch(()=>{});
}

  $('sync').textContent=net?'Онлайн-партия хранится в комнате, история и ачивки на этом устройстве':'Всё хранится на этом устройстве';
  if(!net){el.innerHTML='';return}

}

const fail=msg=>{const e=new Error(msg);e.msg=msg;return e};
async function createRoom(ps,fixed){
  for(let t=0;t<(fixed?1:5);t++){
    const code=fixed||roomCode(),st={v:1,players:ps.map(p=>({id:p.id,name:p.name,dev:DEV})),game:null,by:DEV,rev:1,at:Date.now()};
    const b=await backend(),r=await b.tx(code,cur=>cur==null?JSON.stringify(st):undefined);
    if(r.ok){await enterRoom(code);drawRoom();return}
  }
  // someone opened the same invitation a moment earlier
  if(fixed)return joinRoom(fixed,ps);
  throw fail('Не удалось создать комнату, попробуйте ещё раз.');
}

window.openInvite=async code=>{
  if(net&&net.code===code)return openRoom();
  if(net)await leaveRoom();
  try{
    const s=await txRoom(code,s=>undefined);
    if(s){const err=await startJoin(code);if(err){window.openOnline(code);$('nmsg').textContent=err}return}
    netPick=game&&!game.players.some(p=>p.dev)?game.players.map(p=>p.id).filter(id=>roster.some(r=>r.id===id)).slice(0,1):[];
    drawPick(`Новая комната ${code}`,'Создать комнату',ps=>createRoom(ps,code));
  }catch(e){window.openOnline();$('nmsg').textContent=netErr(e)}
};
async function joinRoom(code,ps){
  let why='';
  const s=await txRoom(code,s=>{
    if(s.players.some(p=>p.dev===DEV))return;
    if(s.game&&!finished(s.game)){why='Партия в этой комнате уже идёт. Войти можно будет, когда она закончится.';return}
    if(s.players.length+ps.length>MAXP){why=`В комнате уже ${s.players.length} игрока, всего можно ${MAXP}.`;return}
    const names=s.players.map(p=>p.name.toLowerCase()),dup=ps.find(p=>names.includes(p.name.toLowerCase()));
    if(dup){why=`В комнате уже есть «${dup.name}». Переименуйте игрока или выберите другого.`;return}
    ps.forEach(p=>s.players.push({id:s.players.some(x=>x.id===p.id)?uid():p.id,name:p.name,dev:DEV}));s.by=DEV;s.rev=(s.rev||0)+1;return s;
  });
  if(!s)throw fail('Комнаты с таким кодом нет. Проверьте код.');
  if(!s.players.some(p=>p.dev===DEV))throw fail(why||'Не получилось войти, попробуйте ещё раз.');
  await enterRoom(code);drawRoom();
}
async function startJoin(code){
  code=code.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==5||[...code].some(c=>!ROOM_CHARS.includes(c)))return 'В коде 5 букв и цифр, например K7MPX.';
  // already in this room on this device: just come back
  const s=await txRoom(code,s=>undefined);
  if(!s)return 'Комнаты с таким кодом нет. Проверьте код.';
  if(s.players.some(p=>p.dev===DEV)){await enterRoom(code);showRoom();return ''}
  netPick=[];drawPick(`Вход в комнату ${code}`,'Войти',ps=>joinRoom(code,ps),s.players.map(p=>p.name),code,s.players);return '';
}
// the same person on a new device, e.g. the invitation opened in Safari and the game continued from the home-screen icon
async function reclaimSeat(code,pid){
  let why='';
  const s=await txRoom(code,s=>{
    const p=s.players.find(x=>x.id===pid);if(!p){why='Такого игрока в комнате больше нет.';return}
    const old=p.dev;s.players.filter(x=>x.dev===old).forEach(x=>x.dev=DEV);
    [s.game,s.prev].forEach(g=>g&&g.players.forEach(x=>{if(x.dev===old)x.dev=DEV}));
    s.by=DEV;s.rev=(s.rev||0)+1;return s;
  });
  if(!s)throw fail('Комнаты с таким кодом нет. Проверьте код.');
  if(!s.players.some(p=>p.id===pid&&p.dev===DEV))throw fail(why||'Не получилось, попробуйте ещё раз.');
  await enterRoom(code);showRoom();
}

function tgSetup(tg){

    try{if(has('6.1')){tg.setHeaderColor(bg);tg.setBackgroundColor(bg)}if(has('7.10'))tg.setBottomBarColor(bg)}catch(e){}
  };

  const insets=()=>{const st=document.documentElement.style,a=tg.safeAreaInset||{},c=tg.contentSafeAreaInset||{};
    st.setProperty('--tg-top',((a.top||0)+(c.top||0))+'px');st.setProperty('--tg-bottom',((a.bottom||0)+(c.bottom||0))+'px');
    document.documentElement.classList.toggle('tgfull',!!tg.isFullscreen)};
  if(has('8.0')){

  // Telegram's back button closes an open sheet, then leaves the statistics
  if(has('6.1')){
    const bb=tg.BackButton,sync=()=>{if($('sheet').firstChild||!$('vstats').hidden)bb.show();else bb.hide()};
    bb.onClick(()=>{if($('sheet').firstChild)sheet.close();else if(!$('vstats').hidden)$('tgame').click()});
    new MutationObserver(sync).observe($('sheet'),{childList:true});
    new MutationObserver(sync).observe($('vstats'),{attributes:true,attributeFilter:['hidden']});
    sync();
  }
  // the Telegram name is offered for a new player until it is in the list
  const u=tg.initDataUnsafe&&tg.initDataUnsafe.user,me=u&&[u.first_name,u.last_name].filter(Boolean).join(' ').trim().slice(0,16);
  if(me)new MutationObserver(()=>{const i=$('nname')||$('newname');
    if(i&&!i.value&&!i.dataset.tg&&!roster.some(r=>r.name.toLowerCase()===me.toLowerCase())){i.value=me;i.dataset.tg='1'}}).observe($('sheet'),{childList:true,subtree:true});
  // a finished game goes to a chat with a link to the bot
  shareVia=text=>tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(TG_APP||location.origin+location.pathname)+'&text='+encodeURIComponent(text+' Сыграем?'));
  if(has('6.9')&&tg.CloudStorage)tgCloud(tg);
  tgSection(tg,has);
  // invitations open the bot's Mini App right in the room
  if(TG_APP)inviteVia=(code,text)=>tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(TG_APP+'?startapp='+code)+'&text='+encodeURIComponent(text));
  if(window.openOnline)tgBot(tg,has);
  render();
  // a link with a room code opens that room; NEW-<code> comes from an invitation made in a chat and creates the room
  const sp=String(tg.initDataUnsafe&&tg.initDataUnsafe.start_param||'').toUpperCase();
  let seen='';try{seen=sessionStorage.getItem('yatzy.tgStart')||''}catch(e){}
  const m=sp.match(/^(NEW-)?([A-HJ-NP-Z2-9]{5})$/);
  if(m&&sp!==seen&&window.openOnline){
    try{sessionStorage.setItem('yatzy.tgStart',sp)}catch(e){}
    if(!net||net.code!==m[2])m[1]?window.openInvite(m[2]):window.openOnline(m[2]);
  }
}

// the bot: "your turn" messages and reminders, a nudge for the player on turn, invitations through @bot in any chat, the rating.
// The bot (server/worker.js) runs elsewhere and reads the app's requests from the database within a minute;
// its features show up once it has published pub/bot.
function tgBot(tg,has){
  const ask=(op,data)=>backend().then(b=>b.send(JSON.stringify({op,init:tg.initData,...data}))).catch(()=>{});
  const read=p=>backend().then(b=>b.read(p));
  // asked again until the bot answers, so a bot started while the app is open is found on the next room
  let on=null;const ready=()=>on||(on=read('pub/bot').then(v=>{if(!v)on=null;return !!v},()=>{on=null;return false}));
  const mine=s=>[...new Set(s.players.concat(s.game?s.game.players:[]).filter(p=>p.dev===DEV).map(p=>p.id))];
  // the bot learns which seats in the room are this Telegram account. Telegram asks whether the bot may write:
  // the first time, and again at most once a day while the bot says it cannot write to this player
  roomHook=(ev,code,s)=>{const pids=mine(s);if(pids.length)ready().then(async ok=>{if(!ok)return;
    const asked=+lsGet('yatzy.tgAsked')||0;let need=!asked;
    if(!need&&Date.now()-asked>864e5){const v=await read('pub/tg/'+code).catch(()=>null);need=!!v&&pids.some(id=>v[id]===0)}
    if(!need||!has('6.9')||!tg.requestWriteAccess)return ask('hello',{code,pids});
    lsSet('yatzy.tgAsked',Date.now());
    try{tg.requestWriteAccess(ok=>ask('hello',{code,pids,allow:!!ok}))}catch(e){ask('hello',{code,pids})}})};
  // Telegram keeps a minimized app alive and visible, so these events say when the player left it
  // and the room is reported again each time the app comes back, in case the bot missed the first time
  const back=()=>{if(net&&net.state)roomHook('back',net.code,net.state)};
  if(has('8.0')){tg.onEvent('deactivated',()=>present(false));tg.onEvent('activated',()=>{present(true);back()})}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')back()});
  const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;
  // the rating marks one's own line by a hash of the Telegram id, the same as the bot makes
  const myHash=u&&crypto.subtle?crypto.subtle.digest('SHA-256',new TextEncoder().encode('yatzy:'+u.id))
    .then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,12)).catch(()=>''):Promise.resolve('');
  ready().then(ok=>{
    if(!ok)return;
    // a nudge goes only to a player the bot can write to, and once an hour from this device
    nudgeVia=async(code,name)=>{
      const say=(title,desc)=>toast({badge:'👉',label:'Бот',name:title,desc},name,false);
      const key='yatzy.nudged.'+code,left=Math.ceil(((lsGet(key)||0)+60*60e3-Date.now())/60e3);
      if(left>0)return say('Уже напомнили',`ещё раз можно через ${left} мин`);
      const p=game&&game.players[whoseTurn()];if(!p)return;
      const can=await read('pub/tg/'+code).then(v=>v?v[p.id]:undefined,()=>null);
      if(can===1){ask('nudge',{code});lsSet(key,Date.now());say('Напомню','бот напишет в течение минуты')}
      else say('Не получится',can===0?'не разрешил боту писать':can===null?'нет связи':'бот его пока не знает: пусть откроет игру из Telegram');
    };
    // the room sheet says for each player whether the bot can write to them; read anew each time the sheet opens
    let known={code:'',at:0,v:null};
    roomBot={stale(){known.at=0},mark(code,pid){
      if(known.code!==code||Date.now()-known.at>15e3){known={code,at:Date.now(),v:known.code===code?known.v:null};
        read('pub/tg/'+code).then(v=>{if(known.code!==code)return;known.v=v||{};if(net&&net.code===code&&$('roomsheet'))drawRoom()},()=>{})}
      const v=known.v;if(!v)return '';
      return v[pid]===1?' · 🔔 бот напишет':v[pid]===0?' · бот не может писать':' · бот не знает';
    }};
    // the invitation is a card from the bot with a button straight into the room
    if(has('6.7'))inviteVia=code=>tg.switchInlineQuery(code,['users','groups']);
    const sec=document.createElement('section');
    sec.innerHTML='<h2>Рейтинг друзей</h2><p class="muted">Онлайн-партии через Telegram, где хотя бы двое зашли из Telegram. Старт 1000, победа над более сильным даёт больше очков.</p><div class="card"><ol class="records" id="tgrating"><li>Загружаю…</li></ol></div>';
    $('vstats').appendChild(sec);
    const load=()=>Promise.all([read('pub/rating'),myHash]).then(([r,h])=>{const el=$('tgrating');if(!el)return;
      const list=Array.isArray(r)?r.filter(Boolean):[];
      el.innerHTML=!list.length?'<li>Пока пусто: рейтинг появится после первой такой партии</li>'
        :list.map((x,k)=>`<li${h&&x.h===h?' class="me"':''}><span>${k+1}. ${esc(x.name)}</span><span><b>${x.r}</b> <small class="muted">${x.g} парт., ${x.w} побед</small></span></li>`).join('')},
      ()=>{const el=$('tgrating');if(el)el.innerHTML='<li>Рейтинг сейчас недоступен</li>'});
    load();$('tstats').addEventListener('click',load);
    render();
  });
}

// finished games and players also live in the user's Telegram cloud: they survive a cleared cache and show up
// on every device with this Telegram account. One key per game (g<time>), a marker for a deleted one (d<time>).
let tgCloudInfo='';
function tgCloud(tg){
  const cs=tg.CloudStorage,call=(fn,...a)=>new Promise((ok,bad)=>fn.call(cs,...a,(e,v)=>e?bad(e):ok(v)));
  // a game that did not reach the cloud brings the backup reminder back
  const lost=()=>{if(cloudKeeps){cloudKeeps=false;render()}};
  const put=(k,v)=>{const j=JSON.stringify(v);if(j.length>4096){lost();return Promise.resolve()}return call(cs.setItem,k,j).catch(lost)};
  const plain=g=>{const {_doc,...x}=g;return x};
  store={
    saveGame(){},
    saveRoster(r){put('roster',r.slice(0,60))},
    addGame(g){put('g'+g.at,plain(g))},
    updateGame(g){put('g'+g.at,plain(g))},
    deleteGame(g){call(cs.removeItem,'g'+g.at).catch(()=>{});put('d'+g.at,1)},
  };
  const show=t=>{tgCloudInfo=t;const el=$('tgcloud');if(el)el.textContent=t};
  show('Подключаюсь к облаку Telegram…');
  (async()=>{
    const keys=await call(cs.getKeys),num=k=>+k.slice(1);
    const gone=new Set(keys.filter(k=>k[0]==='d').map(num)),inCloud=new Set(keys.filter(k=>k[0]==='g').map(num));
    const have=new Set(history.map(g=>g.at)),want=keys.filter(k=>k[0]==='g'&&!have.has(num(k))&&!gone.has(num(k)));
    let changed=false;
    for(let i=0;i<want.length;i+=50){
      const vals=await call(cs.getItems,want.slice(i,i+50));
      Object.values(vals||{}).forEach(v=>{try{const g=JSON.parse(v);if(okSavedGame(g)&&!have.has(g.at)){history.push(g);have.add(g.at);changed=true}}catch(e){}});
    }
    // deleted on another device
    const n=history.length;history=history.filter(g=>!gone.has(g.at));if(history.length!==n)changed=true;
    // the cloud holds about a thousand keys; when it gets close, markers of games deleted long ago make room
    // (the game's own time is in the key; half a year is long enough for every device to have seen the marker)
    if(keys.length>900){const old=keys.filter(k=>k[0]==='d'&&num(k)<Date.now()-182*864e5);if(old.length)call(cs.removeItems,old).catch(()=>{})}
    if(keys.includes('roster')){try{const r=JSON.parse(await call(cs.getItem,'roster'));
      if(Array.isArray(r))r.forEach(x=>{if(okPerson(x)&&!roster.some(y=>y.name===x.name||y.id===x.id)){roster.push({id:x.id,name:x.name});changed=true}})}catch(e){}}
    if(changed){lsSet('yatzy.hist',history);lsSet('yatzy.roster',roster);render()}
    // what is only on this device goes up
    cloudKeeps=true;render();
    history.filter(g=>!inCloud.has(g.at)).forEach(g=>store.addGame(g));
    store.saveRoster(roster);
    show(`Партии и игроки сохраняются в облаке Telegram и видны на всех ваших устройствах с этим аккаунтом. Сейчас там партий: ${history.length}.`);
  })().catch(()=>show('Облако Telegram недоступно, партии хранятся только на этом устройстве.'));
}
// a Telegram block on the statistics tab: the cloud and an icon on the home screen
function tgSection(tg,has){
  const sec=document.createElement('section');
  sec.innerHTML='<h2>Telegram</h2><p class="muted" id="tgcloud"></p><div class="row" id="tghome"></div>';
  $('vstats').appendChild(sec);$('tgcloud').textContent=tgCloudInfo||'Партии хранятся на этом устройстве.';
  if(!has('8.0')||!tg.addToHomeScreen)return;
  const draw=st=>{const el=$('tghome');if(!el)return;
    el.innerHTML=st==='added'?'<p class="muted">Иконка уже на экране «Домой».</p>':st==='unsupported'?'':'<button class="btn" id="tgadd">Иконка на экран «Домой»</button>';
    if($('tgadd'))$('tgadd').onclick=()=>tg.addToHomeScreen()};
  try{tg.checkHomeScreenStatus(draw)}catch(e){draw('unknown')}
  tg.onEvent('homeScreenAdded',()=>draw('added'));
}
</script>
