<style>
/* Layout: a printed dice-game score block — one tall table, categories left, a column per player, tap a cell to pick a score */
:root{
  --bg:#eef2f5; --paper:#ffffff; --ink:#1d2a3a; --muted:#66758a; --rule:#d3dbe4;
  --accent:#1f5fd1; --on-accent:#ffffff; --accent-soft:#e3ecfb; --win:#c23b22; --win-soft:#fbe9e5; --ok:#1f8a4c;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --paper:#182131; --ink:#e6ecf4; --muted:#93a1b5; --rule:#2b384c;
  --accent:#6ea0ff; --on-accent:#0f1520; --accent-soft:#1f2f4d; --win:#ff8a70; --win-soft:#3a2420; --ok:#5ccf8c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --paper:#182131; --ink:#e6ecf4; --muted:#93a1b5; --rule:#2b384c;
  --accent:#6ea0ff; --on-accent:#0f1520; --accent-soft:#1f2f4d; --win:#ff8a70; --win-soft:#3a2420; --ok:#5ccf8c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.3;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.75rem;margin:0;display:flex;align-items:center;gap:12px}
.pip{display:inline-grid;grid-template-columns:repeat(3,6px);gap:3px;padding:6px;border-radius:9px;background:var(--accent)}
.pip i{width:6px;height:6px;border-radius:50%;background:var(--on-accent)}
.pip i.o{background:transparent}
.muted{font-size:.85rem;color:var(--muted);margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:0 18px;font-weight:700;min-height:48px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--win);border-color:var(--win);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{min-height:40px;padding:0 12px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--rule);padding:8px 12px;text-align:left;vertical-align:middle}
td+td,th+th{border-left:1px solid var(--rule);text-align:center}
tbody tr:last-child td{border-bottom:0}
thead th{padding:10px 6px;vertical-align:bottom}
.ph{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ph .nm{border:0;background:transparent;padding:4px 6px;border-radius:8px;font-weight:800;font-size:1.05rem;max-width:100%;overflow-wrap:break-word;hyphens:auto;text-align:center;line-height:1.2}
.ph .tag{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;color:transparent}
th.active .tag{background:var(--accent);color:var(--on-accent)}
th.active,td.colact{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.cat{display:flex;flex-direction:column;gap:2px;min-width:0}
.cat b{font-weight:700}
.cat small{font-size:.75rem;font-weight:400;color:var(--muted);overflow-wrap:anywhere}
td.cell{padding:0;height:56px}
td.cell button{display:block;width:100%;height:56px;border:0;background:transparent;font-size:1.3rem;font-weight:800}
td.cell button:hover{background:var(--accent-soft)}
td.cell button.empty{color:var(--muted);font-weight:400;font-size:1rem}
td.cell button.zero{color:var(--muted);text-decoration:line-through}
tr.sum td{background:var(--bg);font-weight:800}
tr.sum td.v{font-size:1.1rem}
.v .need{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-top:2px}
.v.got{color:var(--ok)}
tr.total td{font-family:var(--display);font-size:1.2rem;background:var(--accent-soft);padding-block:16px}
tr.total td.lead{color:var(--win)}
tr.section td{padding:10px 12px 6px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--paper)}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 18px;border-radius:16px;background:var(--win-soft);border:1px solid var(--win)}
.banner strong{font-family:var(--display);font-size:1.1rem;font-weight:600}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--win-soft)}
.confirm span{flex:1 1 220px}

h2{font-family:var(--display);font-size:1.05rem;margin:0;font-weight:600}
section{display:flex;flex-direction:column;gap:10px}
.tally{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--rule);font-weight:700}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--rule)}
.hist li:last-child{border-bottom:0}
.hist .date{font-size:.8rem;color:var(--muted)}
.hist .res{font-variant-numeric:tabular-nums;font-weight:600;min-width:0;overflow-wrap:anywhere}
.hist .res b{color:var(--win)}

.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--paper);border:1px solid var(--rule);align-self:flex-start}
.tabs button{min-height:44px;padding:0 20px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.view{display:flex;flex-direction:column;gap:24px}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pcard{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pcard h3{margin:0;font-family:var(--display);font-size:1.05rem;font-weight:600;overflow-wrap:anywhere}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-family:var(--display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.streak{align-self:flex-start;font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--win-soft);color:var(--win)}
.records{list-style:none;margin:0;padding:0}
.records li{display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--rule)}
.records li:last-child{border-bottom:0}
.records b{font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table.avg td,table.avg th{padding:8px 12px;font-size:.92rem}
table.avg td+td{font-weight:700}
table.avg td.hi{color:var(--ok)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ach{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--paper);border:1px solid var(--rule);min-width:0}
.ach .badge{flex:none;display:grid;place-items:center;width:52px;height:44px;padding:0 4px;border-radius:12px;letter-spacing:-.02em;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:.72rem;text-align:center;line-height:1}
#stats{display:flex;flex-direction:column;gap:24px}
#banner:empty,#actions:empty,#remind:empty,#dice:empty{display:none}
.ach.off{background:transparent;border-style:dashed}
.ach.off b{color:var(--muted);font-weight:600}
.ach.off .badge{background:transparent;color:var(--muted);border:1.5px solid var(--rule)}
.ach b{display:block}
.ach small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.ach .who{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.ach .who span{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft)}
.ach .who span.no{background:transparent;color:var(--muted);font-weight:600;text-decoration:line-through;border:1px dashed var(--rule)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--rule);background:var(--paper);font-weight:700}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.newach{margin:8px 0 0;font-size:.9rem}
.newach b{color:var(--win)}
.banner>div{min-width:0;flex:1 1 260px}
.remind{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--accent-soft)}
.hist li{cursor:pointer}
.hist li:hover{background:var(--bg)}
.hist .early{font-size:.72rem;font-weight:700;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:1px 8px;margin-left:6px}
.note{margin:0;padding:10px 12px;border-radius:12px;background:var(--win-soft);font-size:.9rem}
.sheet table.avg td,.sheet table.avg th{padding:6px 10px}
.sheet table.avg tr.t td{font-weight:800;background:var(--accent-soft)}
.toasts{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;width:min(420px,100%);padding:12px 14px;border-radius:16px;background:var(--paper);border:1px solid var(--rule);box-shadow:0 10px 30px color-mix(in srgb,#000 22%,transparent);cursor:pointer}
.toast .badge{flex:none;display:grid;place-items:center;width:52px;height:44px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:.72rem;line-height:1;text-align:center}
.toast small{display:block;color:var(--muted);font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.toast b{display:block}
.toast span.who{font-size:.85rem;color:var(--muted)}
.toast.first .badge{background:var(--win)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:tin .35s cubic-bezier(.2,.9,.3,1.3) both}
  .toast.out{animation:tout .25s ease-in both}
  @keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.96)}}
  @keyframes tout{to{opacity:0;transform:translateY(-12px)}}
}
#dice{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.dicebar{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border-radius:16px;background:var(--paper);border:1px solid var(--rule);box-shadow:0 6px 18px color-mix(in srgb,#000 10%,transparent)}
.dicehead{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.dicehead b{font-weight:800}
.dicerow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dies{display:flex;gap:10px;flex-wrap:wrap}
.die{position:relative;width:62px;height:62px;padding:9px;border-radius:14px;border:2px solid var(--rule);background:var(--bg);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center}
.die i{width:10px;height:10px;border-radius:50%;background:var(--ink);visibility:hidden}
.die i.on{visibility:visible}
.die.blank i{visibility:hidden}
.die.held{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-4px)}
.die.held::after{content:"держу";position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:.65rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.die:disabled{cursor:default}
.die.tumble{animation:tumble .32s linear infinite}
.die.land{animation:land .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes tumble{0%{transform:translateY(-6px) rotate(-18deg) scale(.94)}50%{transform:translateY(2px) rotate(16deg) scale(1.03)}100%{transform:translateY(-6px) rotate(-18deg) scale(.94)}}
@keyframes land{0%{transform:translateY(-10px) scale(1.12)}60%{transform:translateY(2px) scale(.96)}100%{transform:none}}
.dicebar.rolling .muted{visibility:hidden}
@media (prefers-reduced-motion:reduce){.die.tumble,.die.land{animation:none}}
.rollbtn{min-width:150px}
.dicebar>p{margin-top:8px}
td.cell button.sug{color:var(--accent);font-weight:700;font-size:1.05rem;background:color-mix(in srgb,var(--accent-soft) 60%,transparent);border:0}
td.cell button.sug.z{color:var(--muted);font-weight:400}
td.cell button.sug.best{background:var(--accent);color:var(--on-accent);font-weight:800}
@media (max-width:520px){.die{width:50px;height:50px;padding:7px}.die i{width:8px;height:8px}.dies{gap:8px}}
.sheet-bg{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow:auto}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px;max-height:80%}}
.sheet h3{margin:0;font-family:var(--display);font-size:1.1rem;font-weight:600}
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.vals button{min-height:56px;border-radius:12px;border:1.5px solid var(--rule);background:var(--bg);font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
.vals button.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vals button.z{color:var(--muted)}
.roster{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;gap:8px;align-items:center}
.pick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-radius:12px;border:1.5px solid var(--rule);background:var(--bg);font-weight:700;text-align:left}
.pick .seat{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--rule);font-size:.85rem;font-variant-numeric:tabular-nums}
.pick span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick.on .seat{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.del{flex:none;min-height:52px;min-width:52px;border-radius:12px;border:1.5px solid var(--rule);background:var(--paper);color:var(--muted);font-weight:700;padding:0 10px}
.del.arm{background:var(--win);border-color:var(--win);color:var(--on-accent)}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1.5px solid var(--rule);background:var(--bg);padding:0 14px}
@media (max-width:520px){
  th,td{padding-inline:8px}
  .cat small{display:none}
  td.cell button{font-size:1.1rem}
  .ph .nm{font-size:.9rem}
  tr.total td{font-size:1rem}
  h1{font-size:1.4rem}
}
@media (prefers-reduced-motion:no-preference){td.cell button,.pick{transition:background .15s,border-color .15s}}
</style>

</head><body>

<div class="wrap">
  <header>
    <h1><span class="pip" aria-hidden="true"><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i></span>Яцзы</h1>
    <button class="btn small" id="players">Игроки</button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tgame" aria-selected="true">Партия</button>
    <button role="tab" id="tstats" aria-selected="false">Статистика</button>
  </nav>

  <div id="vgame" class="view">
    <div id="remind"></div>
    <div id="banner"></div>
    <div id="dice"></div>
    <div class="card"><table id="table"></table></div>
    <div id="actions"></div>
  </div>

  <div id="vstats" class="view" hidden>
    <div id="stats"></div>
    <section>
      <h2>Прошлые игры</h2>
      <div class="tally" id="tally"></div>
      <div class="card"><ul class="hist" id="hist"></ul></div>
    </section>
  <section>
    <h2>Резервная копия</h2>
    <p class="muted">Нажмите «Сохранить копию» → «Сохранить в Файлы» и выберите папку, например в iCloud Drive. В следующий раз сохраняйте туда же и заменяйте старый файл: в нём всегда вся история. Из него же всё восстанавливается.</p>
    <div class="row"><button class="btn" id="exp">Сохранить копию</button><label class="btn" for="imp">Восстановить из файла</label><input type="file" id="imp" accept=".json,application/json" hidden></div>
    <p class="muted" id="blast"></p>
    <p class="muted" id="bmsg"></p>
  </section>

  </div>
  <p class="muted" id="sync"></p>
</div>
<div id="sheet"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const range=(a,b,s=1)=>{const r=[];for(let x=a;x<=b;x+=s)r.push(x);return r};
const UP=[1,2,3,4,5,6].map((n,i)=>({id:'u'+n,name:['Единицы','Двойки','Тройки','Четвёрки','Пятёрки','Шестёрки'][i],hint:'сумма '+['единиц','двоек','троек','четвёрок','пятёрок','шестёрок'][i],vals:range(0,5).map(k=>k*n),par:3*n}));
const LOW=[
  {id:'three',name:'Тройка',hint:'три одинаковых, сумма всех кубиков',vals:[0,...range(5,30)]},
  {id:'four',name:'Каре',hint:'четыре одинаковых, сумма всех кубиков',vals:[0,...range(5,30)]},
  {id:'small',name:'Малый стрит',hint:'четыре подряд',vals:[0,30]},
  {id:'large',name:'Большой стрит',hint:'пять подряд',vals:[0,40]},
  {id:'house',name:'Фулл-хаус',hint:'тройка + пара',vals:[0,25]},
  {id:'chance',name:'Шанс',hint:'сумма всех кубиков',vals:[0,...range(5,30)]},
  {id:'yatzy',name:'Яцзы',hint:'пять одинаковых',vals:[0,50]},
];
const ALL=[...UP,...LOW];
const JK={id:'joker',name:'Джокер',hint:'повторный Яцзы, один раз за игру; в другую клетку 0',vals:[0,100]};
const MAXP=4;
const uid=()=>Math.random().toString(36).slice(2,9);

let roster=[], game=null, history=[], ui={confirm:false}, store=null;

function normGame(g){
  if(!g||!Array.isArray(g.scores))return null;
  if(!g.players&&Array.isArray(g.names))g.players=g.names.map(n=>({id:uid(),name:n}));
  if(!Array.isArray(g.players)||g.players.length!==g.scores.length)return null;
  delete g.names;
  g.scores.forEach(s=>{delete s.pair;delete s.twopair;if(s.joker>100)s.joker=100});
  return g;
}
function newGameFor(players){const dice=!!lsGet('yatzy.dice');return {players:players.map(p=>({id:p.id,name:p.name})),scores:players.map(()=>({})),started:Date.now(),saved:false,dice,roll:dice?newRoll():null}}

function totals(i){
  const s=game.scores[i];let up=0,low=0;
  UP.forEach(c=>{if(s[c.id]!=null)up+=s[c.id]});
  LOW.forEach(c=>{if(s[c.id]!=null)low+=s[c.id]});
  const par=UP.reduce((a,c)=>a+(s[c.id]!=null?s[c.id]-c.par:0),0);
  const upFilled=UP.filter(c=>s[c.id]!=null).length;
  const bonus=up>=63?50:0, jk=s.joker||0;
  return {up,bonus,low,jk,total:up+bonus+low+jk,par,upFilled,filled:ALL.filter(c=>s[c.id]!=null).length};
}
const done=()=>game&&game.players.every((_,i)=>totals(i).filled===ALL.length);

// achievement pop-ups: ones that depend only on a player's own cells show up as soon as they are earned,
// the rest (wins, streaks, records) when the game ends
const LIVE=['yatzy','joker','bonus','upper80','sixes','ladder','chance','ones','chance30','nochance','low150','fullset','solid'];
function toast(a,name,first){
  const box=$('toasts');if(!box)return;
  const t=document.createElement('div');t.className='toast'+(first?' first':'');
  t.innerHTML=`<span class="badge">${a.badge}</span><div style="min-width:0"><small>${first?'Новая ачивка':'Ачивка'}</small><b>${a.name}</b><span class="who">${esc(name)} · ${a.desc}</span></div>`;
  const kill=()=>{if(t.classList.contains('out'))return;t.classList.add('out');setTimeout(()=>t.remove(),260)};
  t.onclick=kill;box.appendChild(t);setTimeout(kill,4200);
  while(box.children.length>4)box.firstChild.remove();

let toastQ=Promise.resolve();
function toastLater(a,name,first){toastQ=toastQ.then(()=>new Promise(r=>{toast(a,name,first);setTimeout(r,600)}))}
function liveCtx(sc){const up=UP.reduce((a,c)=>a+(sc[c.id]||0),0),low=LOW.reduce((a,c)=>a+(sc[c.id]||0),0);return {sc,up,low,p:{total:0},s:{}}}
function hadBefore(name,id){return history.some(g=>!g.early&&g.players.some(p=>p.name===name&&ACH.find(a=>a.id===id).t(liveCtx(p.scores||{}))))}
function checkLive(i,beforeSc){
  const sc=game.scores[i],name=game.players[i].name,shown=(game.shown=game.shown||{})[name]=(game.shown[name]||[]);
  ACH.filter(a=>LIVE.includes(a.id)).forEach(a=>{
    if(shown.includes(a.id))return;
    if(a.t(liveCtx(sc))&&!a.t(liveCtx(beforeSc))){shown.push(a.id);toastLater(a,name,!hadBefore(name,a.id))}
  });
}
// on-screen dice: up to three rolls per turn, tap a die to keep it
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const newRoll=()=>({dice:[0,0,0,0,0],held:[false,false,false,false,false],n:0,jokerTaken:false});
// fair die: crypto random bytes, values 252..255 are re-drawn so every face has exactly 1/6
const rnd6=()=>{try{const a=new Uint8Array(1);do crypto.getRandomValues(a);while(a[0]>=252);return 1+a[0]%6}catch(e){return 1+Math.floor(Math.random()*6)}};
function scoreFor(cid,d){
  const cnt=[0,0,0,0,0,0,0];d.forEach(x=>cnt[x]++);
  const sum=d.reduce((a,b)=>a+b,0),mx=Math.max(...cnt),has=n=>cnt[n]>0;
  const run=(a,b)=>{for(let k=a;k<=b;k++)if(!has(k))return false;return true};
  if(cid[0]==='u'){const n=+cid[1];return n*cnt[n]}
  switch(cid){
    case 'three':return mx>=3?sum:0;
    case 'four':return mx>=4?sum:0;
    case 'small':return run(1,4)||run(2,5)||run(3,6)?30:0;
    case 'large':return run(1,5)||run(2,6)?40:0;
    case 'house':return cnt.includes(3)&&cnt.includes(2)?25:0;
    case 'chance':return sum;
    case 'yatzy':return mx===5?50:0;
  }
  return null;
}
function suggestions(i){
  const r=game.roll,sc=game.scores[i];if(!game.dice||!r||!r.n)return null;
  const out={},isY=Math.max(...[1,2,3,4,5,6].map(n=>r.dice.filter(x=>x===n).length))===5;
  ALL.forEach(c=>{if(sc[c.id]==null)out[c.id]=r.jokerTaken?0:scoreFor(c.id,r.dice)});
  if(sc.joker==null&&!r.jokerTaken&&isY&&sc.yatzy===50)out.joker=100;
  return out;
}
function renderDice(){
  const el=$('dice');
  if(!game||!game.dice||over()){el.innerHTML='';return}
  const r=game.roll=game.roll||newRoll(),turn=whoseTurn(),who=game.players[turn].name;
  const hint=r.jokerTaken?`Джокер записан. Теперь поставьте 0 в любую свободную клетку колонки «${esc(who)}».`
    :!r.n?'Нажмите «Бросить».':r.n<3?'Нажмите на кубики, которые хотите оставить, и бросайте ещё, или выберите клетку в таблице.':'Броски закончились: выберите клетку в таблице.';
  el.innerHTML=`<div class="dicebar"><div class="dicehead"><span>Ходит <b>${esc(who)}</b></span><span class="muted">бросок ${r.n} из 3</span></div>
    <div class="dicerow"><div class="dies">${r.dice.map((v,k)=>`<button class="die${r.held[k]?' held':''}${v?'':' blank'}" data-k="${k}" ${!r.n||r.n>=3||r.jokerTaken?'disabled':''} aria-label="${v?'Кубик '+v:'Кубик'}${r.held[k]?', держу':''}">${range(0,8).map(q=>`<i class="${v&&PIPS[v].includes(q)?'on':''}"></i>`).join('')}</button>`).join('')}</div>
    <button class="btn primary rollbtn" id="roll" ${r.n>=3||r.jokerTaken?'disabled':''}>${r.n?'Бросить ещё':'Бросить'}</button></div>
    <p class="muted">${hint}</p></div>`;
  el.querySelectorAll('.die').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;r.held[k]=!r.held[k];saveGame();renderDice()});
  $('roll').onclick=rollDice;
}
// the result is drawn and saved at once; the animation only reveals it:
// free dice tumble, slow down and stop one by one, then the table shows the options
let rolling=false;
function setFace(el,v){el.querySelectorAll('i').forEach((p,q)=>p.classList.toggle('on',PIPS[v].includes(q)));el.classList.remove('blank')}
function rollDice(){
  const r=game.roll;if(rolling||!r||r.n>=3||r.jokerTaken)return;
  const free=r.dice.map((_,k)=>!r.held[k]||!r.n);
  if(!r.n)r.held=r.held.map(()=>false);
  free.forEach((f,k)=>{if(f)r.dice[k]=rnd6()});
  r.n++;saveGame();
  const quick=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const els=[...document.querySelectorAll('.die')],order=free.map((f,k)=>f?k:-1).filter(k=>k>=0);
  rolling=true;$('roll').disabled=true;els.forEach(d=>d.disabled=true);
  document.querySelector('.dicebar').classList.add('rolling');
  const t0=performance.now(),stopAt={};order.forEach((k,j)=>stopAt[k]=(quick?150:850)+j*(quick?0:220));
  const last=Math.max(...Object.values(stopAt));
  order.forEach(k=>{els[k].classList.remove('held');els[k].classList.add('tumble')});
  let next={};
  const tick=now=>{
    const el=now-t0;
    order.forEach(k=>{
      const d=els[k];if(!d.classList.contains('tumble'))return;
      if(el>=stopAt[k]){d.classList.remove('tumble');setFace(d,r.dice[k]);void d.offsetWidth;d.classList.add('land');try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}return}
      // faces flip fast at first and slower towards the stop
      const left=stopAt[k]-el,gap=left>500?55:left>250?110:190;
      if(!next[k]||now>=next[k]){let f;do f=rnd6();while(d.dataset.f==f);d.dataset.f=f;setFace(d,f);next[k]=now+gap}
    });
    if(el<last+380)requestAnimationFrame(tick);else{rolling=false;render()}
  };
  requestAnimationFrame(tick);
}
function setScore(i,cid,v){
  const beforeSc={...game.scores[i]};
  const turnBefore=whoseTurn();
  (game.log=game.log||[]).push({pid:game.players[i].id,cid,prev:game.scores[i][cid],roll:game.roll?JSON.parse(JSON.stringify(game.roll)):null});
  if(game.log.length>200)game.log.shift();
  if(v==null)delete game.scores[i][cid];else game.scores[i][cid]=v;
  if(v!=null)checkLive(i,beforeSc);
  // in dice mode a score for the player on turn ends the turn, except the joker, after which a 0 is still due
  if(game.dice&&v!=null&&i===turnBefore){if(cid==='joker'&&game.roll)game.roll.jokerTaken=true;else game.roll=newRoll()}
  changed();
}
function undo(){
  const e=(game.log||[]).pop();if(!e)return;
  const i=game.players.findIndex(p=>p.id===e.pid);
  if(i>=0){if(e.prev==null)delete game.scores[i][e.cid];else game.scores[i][e.cid]=e.prev}
  if('roll' in e)game.roll=e.roll;
  if(game.saved)unarchive();
  saveGame();render();
}

function renamePlayer(id,name){
  name=name.trim().slice(0,16);
  if(!name)return 'Введите имя';
  if(roster.some(r=>r.id!==id&&r.name.toLowerCase()===name.toLowerCase()))return 'Игрок с таким именем уже есть';
  let r=roster.find(x=>x.id===id);
  const gp=game&&game.players.find(x=>x.id===id);
  if(!r&&gp){r={id,name:gp.name};roster.push(r)}
  if(!r)return 'Игрок не найден';
  const old=r.name;if(old===name)return null;
  r.name=name;if(gp)gp.name=name;
  history.forEach(g=>{let hit=false;
    g.players.forEach(p=>{if(p.id===id||(!p.id&&p.name===old)){p.name=name;p.id=id;hit=true}});
    if(hit){if(g.winner===old)g.winner=name;store&&store.updateGame&&store.updateGame(g)}});

  return null;

function openRename(id){

let pick=[],arm=null;

function editInSetup(id){

function drawSetup(){

function archive(){
  const T=game.players.map((_,i)=>totals(i)),best=Math.max(...T.map(t=>t.total)),w=T.filter(t=>t.total===best);
  const g={at:Date.now(),started:game.started,players:game.players.map((p,i)=>({id:p.id,name:p.name,total:T[i].total,scores:{...game.scores[i]}})),
    winner:w.length>1?null:game.players[T.findIndex(t=>t.total===best)].name};
  if(game.ended&&!done())g.early=true;
  const before=computeStats();
  game.saved=true;game.savedAt=g.at;history.push(g);lsSet('yatzy.hist',history);
  const after=computeStats();
  game.newAch=after.players.filter(p=>g.players.some(x=>x.name===p.name)).map(p=>{const b=before.players.find(x=>x.name===p.name);
    return {name:p.name,list:ACH.filter(a=>p.ach[a.id]&&(!b||!b.ach[a.id]||b.ach[a.id].n<p.ach[a.id].n)).map(a=>({id:a.id,name:a.name,first:!b||!b.ach[a.id]}))}});
  // pop up what was not shown during the game, new ones first, at most five; the rest are listed under the result
  const pend=[];game.newAch.forEach(x=>x.list.forEach(a=>{if(!((game.shown||{})[x.name]||[]).includes(a.id))pend.push({a:ACH.find(z=>z.id===a.id),name:x.name,first:a.first})}));
  pend.sort((x,y)=>y.first-x.first);
  pend.slice(0,5).forEach(x=>toastLater(x.a,x.name,x.first));
  if(pend.length>5)toastLater({badge:'+'+(pend.length-5),name:'И ещё '+(pend.length-5),desc:'список под итогом партии'},'Ачивки',false);
  store&&store.addGame(g);renderHist();
}
function unarchive(){
  if(game.savedAt)deleteGame(game.savedAt);
  game.saved=false;game.savedAt=null;game.newAch=null;game.ended=false;
}
function deleteGame(at){
  const g=history.find(x=>x.at===at);if(!g)return;
  history=history.filter(x=>x!==g);lsSet('yatzy.hist',history);
  store&&store.deleteGame&&store.deleteGame(g);
  // the current game stays marked as handled so it is not archived again
  if(game&&game.savedAt===at){game.savedAt=null;game.newAch=null;saveGame()}
  renderHist();
}
function openGame(at){
  const g=history.find(x=>x.at===at);if(!g)return;
  const d=new Date(g.at).toLocaleString('ru-RU',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const up=p=>UP.reduce((a,c)=>a+(p.scores[c.id]||0),0);
  const cellv=v=>v==null?'—':v;
  let armed=false;
  const draw=()=>{sheet.open(`<h3>${g.winner?'Победа: '+esc(g.winner):'Ничья'}</h3><p class="muted">${d}${g.early?' · закончена досрочно':''}</p>
    <div class="card scroll"><table class="avg"><thead><tr><th style="width:40%"></th>${g.players.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr></thead><tbody>
    ${UP.map(c=>`<tr><td>${c.name}</td>${g.players.map(p=>`<td>${cellv(p.scores[c.id])}</td>`).join('')}</tr>`).join('')}
    <tr class="t"><td>Бонус</td>${g.players.map(p=>`<td>${up(p)>=63?'+50':'0'}</td>`).join('')}</tr>
    ${[...LOW,JK].map(c=>`<tr><td>${c.name}</td>${g.players.map(p=>`<td>${cellv(p.scores[c.id])}</td>`).join('')}</tr>`).join('')}
    <tr class="t"><td>Итого</td>${g.players.map(p=>`<td>${p.total}</td>`).join('')}</tr></tbody></table></div>
    <div class="row"><button class="btn${armed?' danger':''}" id="gdel">${armed?'Точно удалить?':'Удалить партию'}</button><button class="btn" id="cancel">Закрыть</button></div>`);
    $('cancel').onclick=sheet.close;
    $('gdel').onclick=()=>{if(armed){deleteGame(at);sheet.close()}else{armed=true;draw()}};};
  draw();
}

function computeStats(){
  const games=[...history].sort((a,b)=>a.at-b.at),P={},rec={best:null,margin:null,worst:null};
  const get=n=>P[n]||(P[n]={name:n,games:0,wins:0,sum:0,best:0,worst:Infinity,bonus:0,yatzy:0,joker:0,zeros:{},cat:{},streak:0,bestStreak:0,ach:{},last:[],lossRun:0,run200:0,days:{}});
  games.forEach(g=>{
    const sorted=[...g.players].sort((a,b)=>b.total-a.total);
    const margin=sorted.length>1?sorted[0].total-sorted[1].total:0;
    if(g.winner&&(!rec.margin||margin>rec.margin.v))rec.margin={v:margin,who:g.winner,at:g.at};
    g.players.forEach(p=>{
      const s=get(p.name),sc=p.scores||{},won=g.winner===p.name,prevBest=s.best,lossRun=s.lossRun;
      const up=UP.reduce((a,c)=>a+(sc[c.id]||0),0),zeros=ALL.filter(c=>sc[c.id]===0).length;
      s.games++;s.sum+=p.total;s.best=Math.max(s.best,p.total);s.worst=Math.min(s.worst,p.total);s.last.push(won);
      if(up>=63)s.bonus++;if(sc.yatzy===50)s.yatzy++;if(sc.joker===100)s.joker++;
      ALL.forEach(c=>{if(sc[c.id]==null)return;(s.cat[c.id]=s.cat[c.id]||[]).push(sc[c.id]);if(sc[c.id]===0)s.zeros[c.id]=(s.zeros[c.id]||0)+1});
      (s.cat.joker=s.cat.joker||[]).push(sc.joker||0);
      if(won){s.wins++;s.streak++;s.bestStreak=Math.max(s.bestStreak,s.streak);s.lossRun=0}else{s.streak=0;if(g.winner)s.lossRun++}
      s.run200=p.total>=200?s.run200+1:0;
      const dk=new Date(g.at).toDateString();s.days[dk]=(s.days[dk]||0)+1;
      if(!rec.best||p.total>rec.best.v)rec.best={v:p.total,who:p.name,at:g.at};
      if(!rec.worst||p.total<rec.worst.v)rec.worst={v:p.total,who:p.name,at:g.at};
      const low=LOW.reduce((a,c)=>a+(sc[c.id]||0),0),top=sorted[0].total;
      const c={p,sc,up,low,won,margin,zeros,s,prevBest,lossRun,top,behind:top-p.total,draw:!g.winner&&g.players.length>1,hour:new Date(g.at).getHours(),dayN:s.days[dk]};
      if(!g.early)ACH.forEach(a=>{if(a.t(c)){const r=s.ach[a.id]||(s.ach[a.id]={n:0,first:g.at});r.n++}});
    });
  });
  return {players:Object.values(P).sort((a,b)=>b.wins-a.wins||b.games-a.games),rec,count:games.length};
}

const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const fmt=x=>Math.round(x).toLocaleString('ru-RU');
const pct=(a,b)=>b?Math.round(100*a/b)+'%':'—';
const day=t=>new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
let statFilter=null;

function renderStats(){
  const st=computeStats(),el=$('stats');
  if(!st.count){
    el.innerHTML=`<div class="card" style="padding:20px"><p style="margin:0 0 6px;font-weight:700">Статистика появится после первой законченной партии</p><p class="muted">Здесь будут победы, средний счёт, рекорды и средние очки по каждой клетке. Ниже все ачивки, которые можно открыть.</p></div>`+achGrid(st);
    return;
  }
  let h=`<div class="pcards">${st.players.map(p=>{
    const z=Object.entries(p.zeros).sort((a,b)=>b[1]-a[1])[0];
    const zc=z?[...ALL].find(c=>c.id===z[0]).name:'—';
    return `<div class="pcard"><h3>${esc(p.name)}</h3>
      <div class="big"><b>${p.wins}</b><span class="muted">${p.wins===1?'победа':p.wins>=2&&p.wins<=4?'победы':'побед'} из ${p.games} · ${pct(p.wins,p.games)}</span></div>
      ${p.streak>=2?`<span class="streak">${p.streak} ${p.streak<=4?'победы':'побед'} подряд</span>`:''}
      <dl class="kv"><dt>Средний счёт</dt><dd>${fmt(p.sum/p.games)}</dd><dt>Лучший / худший</dt><dd>${p.best} / ${p.worst}</dd>
      <dt>Бонус взят</dt><dd>${pct(p.bonus,p.games)}</dd><dt>Яцзы</dt><dd>${p.yatzy} из ${p.games}</dd><dt>Джокеров</dt><dd>${p.joker}</dd>
      <dt>Лучшая серия побед</dt><dd>${p.bestStreak}</dd><dt>Чаще вычёркивает</dt><dd>${zc}</dd></dl></div>`}).join('')}</div>`;
  const r=st.rec;
  h+=`<section><h2>Рекорды</h2><div class="card"><ul class="records">
    <li><span>Самый большой счёт</span><span><b>${r.best.v}</b> · ${esc(r.best.who)}, ${day(r.best.at)}</span></li>
    ${r.margin?`<li><span>Самый крупный отрыв</span><span><b>${r.margin.v}</b> · ${esc(r.margin.who)}, ${day(r.margin.at)}</span></li>`:''}
    <li><span>Самый скромный счёт</span><span><b>${r.worst.v}</b> · ${esc(r.worst.who)}, ${day(r.worst.at)}</span></li>
    <li><span>Сыграно партий</span><span><b>${st.count}</b></span></li></ul></div></section>`;
  const ps=st.players;
  h+=`<section><h2>Средние очки по клеткам</h2><div class="card scroll"><table class="avg"><thead><tr><th style="width:40%"></th>${ps.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr></thead><tbody>
    ${[...ALL,JK].map(c=>{const vals=ps.map(p=>avg(p.cat[c.id]||[]));const mx=Math.max(...vals);
      return `<tr><td>${c.name}</td>${vals.map(v=>`<td class="${ps.length>1&&v===mx&&v>0?'hi':''}">${v?v.toFixed(1).replace('.',','):'0'}</td>`).join('')}</tr>`}).join('')}
  </tbody></table></div></section>`;
  el.innerHTML=h+achGrid(st);
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{statFilter=b.dataset.n||null;renderStats()});
}

function achGrid(st){
  const ps=st.players,sel=ps.find(p=>p.name===statFilter);
  const seg=ps.length>1?`<div class="seg"><button class="${sel?'':'on'}" data-n="">Все</button>${ps.map(p=>`<button class="${sel===p?'on':''}" data-n="${esc(p.name)}">${esc(p.name)}</button>`).join('')}</div>`:'';
  const pool=sel?[sel]:ps,cmp=!sel&&ps.length>1;
  const score=ps.length?`<div class="tally">${ps.map(p=>`<span class="chip">${esc(p.name)}: ${ACH.filter(a=>p.ach[a.id]).length} из ${ACH.length}</span>`).join('')}</div>`:'';
  return `<section><h2>Ачивки</h2>${score}${seg}<div class="achs">${ACH.map(a=>{
    const who=pool.filter(p=>p.ach[a.id]);
    const pills=cmp?pool.map(p=>p.ach[a.id]?`<span>${esc(p.name)}${p.ach[a.id].n>1?' ×'+p.ach[a.id].n:''}</span>`:`<span class="no">${esc(p.name)}</span>`).join('')
      :who.map(p=>`<span>${p.ach[a.id].n>1?'×'+p.ach[a.id].n:'есть'}</span>`).join('');
    return `<div class="ach${who.length?'':' off'}"><span class="badge">${a.badge}</span><div style="min-width:0"><b>${a.name}</b><small>${a.desc}</small>${pills&&(who.length||cmp)?`<div class="who">${pills}</div>`:''}</div></div>`}).join('')}</div></section>`;
}

// GitHub Pages version only: file backup and offline cache
$('sync').textContent='Всё хранится на этом устройстве';
// share sheet first ("Save to Files" can replace the previous copy), plain download as a fallback
function exportBackup(){
  const json=JSON.stringify({app:'yatzy',v:2,saved:Date.now(),roster,history,game},null,1);
  const name='yatzy-backup.json';
  const done=()=>{
    $('bmsg').textContent='В копии партий: '+history.length+', игроков: '+roster.length;
    lsSet('yatzy.backupAt',history.length);lsSet('yatzy.backupTime',Date.now());render();
  };
  const download=()=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);done();
  };
  let file=null;try{file=new File([json],name,{type:'application/json'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Яцзы: резервная копия'}).then(done).catch(e=>{if(e&&e.name!=='AbortError')download()});
  } else download();
}
$('exp').onclick=exportBackup;
$('imp').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.history))throw 0;
    const seen=new Set(history.map(g=>g.at));let n=0;
    d.history.forEach(g=>{if(!seen.has(g.at)){history.push(g);n++}});
    (d.roster||[]).forEach(r=>{if(!roster.some(x=>x.name===r.name))roster.push(r)});
    lsSet('yatzy.hist',history);saveRoster();render();
    $('bmsg').textContent='Добавлено партий: '+n+'. Всего в истории: '+history.length;
  }catch(_){$('bmsg').textContent='Это не файл копии Яцзы. Выберите файл yatzy-….json'}
  e.target.value='';
};
// a home-screen app can stay open for days: look for a new version whenever it comes back to the foreground
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded||document.querySelector('.sheet'))return;reloaded=true;location.reload()});
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
// remind about a backup every 5 finished games
function lastBackupText(since){
  const t=lsGet('yatzy.backupTime');
  if(!t)return 'Резервную копию ещё не сохраняли.';
  const d=new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  return 'Последняя копия: '+d+(since>0?', после неё сыграно партий: '+since:', все партии в ней')+'.';
}
window.onAfterRender=()=>{
  const since=history.length-(lsGet('yatzy.backupAt')||0);
  if($('blast'))$('blast').textContent=lastBackupText(since);
  const el=$('remind');if(!el)return;
  if(since>=5&&(!game||!anyScore()||over())){
    el.innerHTML=`<div class="remind"><span>${lastBackupText(since)} Сохраните копию, чтобы история не потерялась.</span><button class="btn small" id="rexp">Сохранить копию</button></div>`;
    $('rexp').onclick=exportBackup;
  } else el.innerHTML='';
};
render();
</script>
</body></html>
