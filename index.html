<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Яцзы">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Блокнот Яцзы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;800&display=swap">
<style>
/* Layout: a printed dice-game score block — one tall table, categories left, two player columns, tap a cell to pick a score */
:root{
  --bg:#eef2f5; --paper:#ffffff; --ink:#1d2a3a; --muted:#66758a; --rule:#d3dbe4;
  --accent:#1f5fd1; --accent-soft:#e3ecfb; --win:#c23b22; --win-soft:#fbe9e5; --ok:#1f8a4c;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --paper:#182131; --ink:#e6ecf4; --muted:#93a1b5; --rule:#2b384c;
  --accent:#6ea0ff; --accent-soft:#1f2f4d; --win:#ff8a70; --win-soft:#3a2420; --ok:#5ccf8c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --paper:#182131; --ink:#e6ecf4; --muted:#93a1b5; --rule:#2b384c;
  --accent:#6ea0ff; --accent-soft:#1f2f4d; --win:#ff8a70; --win-soft:#3a2420; --ok:#5ccf8c; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,4vw,2rem);margin:0;letter-spacing:.01em;display:flex;align-items:center;gap:12px}
.pip{display:inline-grid;grid-template-columns:repeat(3,6px);gap:3px;padding:6px;border-radius:9px;background:var(--accent)}
.pip i{width:6px;height:6px;border-radius:50%;background:var(--paper)}
.pip i.o{background:transparent}
.sync{font-size:.8rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:12px 18px;font-weight:700;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.danger{background:var(--win);border-color:var(--win);color:var(--paper)}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
col.cat{width:44%}
th,td{border-bottom:1px solid var(--rule);height:54px;padding:0 12px;text-align:left}
td+td,th+th{border-left:1px solid var(--rule);text-align:center}
thead th{height:auto;padding:12px 8px;vertical-align:bottom;background:var(--paper)}
.pname{width:100%;border:1.5px dashed transparent;border-radius:10px;background:transparent;font:inherit;font-weight:800;font-size:1.05rem;text-align:center;padding:8px 4px;color:var(--ink)}
.pname:hover{border-color:var(--rule)}
.turn{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);height:1.2em}
th.active .turn{color:var(--accent)}
th.active .pname{background:var(--accent-soft)}
.catname{font-weight:600}
.hint{display:block;font-size:.75rem;color:var(--muted);font-weight:400}
td.cell{padding:0}
td.cell button{width:100%;height:100%;min-height:54px;border:0;background:transparent;font-size:1.3rem;font-weight:800}
td.cell button:hover{background:var(--accent-soft)}
td.cell button.empty{color:var(--muted);font-weight:400;font-size:1rem}
td.cell button.zero{color:var(--muted);text-decoration:line-through}
td.colact{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
tr.sum td{background:var(--bg);font-weight:800;height:46px}
tr.sum td.v{font-size:1.1rem}
tr.bonus td.v.got{color:var(--ok)}
.need{display:block;font-size:.72rem;font-weight:600;color:var(--muted)}
tr.total td{height:64px;font-family:var(--display);font-size:1.25rem;background:var(--accent-soft)}
tr.total td.lead{color:var(--win)}
tr.section td{height:auto;padding:8px 12px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--paper)}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 18px;border-radius:16px;background:var(--win-soft);border:1px solid var(--win)}
.banner strong{font-family:var(--display);font-size:1.15rem}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--win-soft)}

h2{font-family:var(--display);font-size:1.05rem;margin:8px 0 0;font-weight:600}
.tally{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--rule);font-weight:700}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.hist li:last-child{border-bottom:0}
.hist .date{font-size:.8rem;color:var(--muted)}
.hist .res{font-variant-numeric:tabular-nums;font-weight:600}
.hist .res b{color:var(--win)}
.empty-h{padding:16px;color:var(--muted)}

.sheet-bg{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:85%;overflow:auto}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0;font-family:var(--display);font-size:1.1rem;font-weight:600}
.sheet p{margin:0;color:var(--muted);font-size:.9rem}
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.vals button{min-height:56px;border-radius:12px;border:1.5px solid var(--rule);background:var(--bg);font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
.vals button.sel{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.vals button.z{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:480px){th,td{padding:0 8px}.hint{display:none}td.cell button{font-size:1.1rem}}
@media (prefers-reduced-motion:no-preference){td.cell button{transition:background .15s}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>

<div class="wrap">
  <header>
    <h1><span class="pip" aria-hidden="true"><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i></span>Яцзы</h1>
    <span class="sync" id="sync">Хранится на этом iPad</span>
  </header>

  <div id="banner"></div>

  <div class="card">
    <table>
      <colgroup><col class="cat"><col><col></colgroup>
      <thead><tr><th></th><th id="h0"></th><th id="h1"></th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div class="actions" id="actions"></div>

  <section>
    <h2>Прошлые игры</h2>
    <div class="tally" id="tally" style="margin:10px 0"></div>
    <div class="card"><ul class="hist" id="hist"></ul></div>
  </section>

  <section>
    <h2>Резервная копия</h2>
    <p class="sync" style="margin:6px 0 12px">Сохраните файл с историей в «Файлы» или iCloud Drive. Из него же можно всё восстановить.</p>
    <div class="actions"><button class="btn" id="exp">Сохранить копию</button><label class="btn" for="imp" style="display:inline-flex;align-items:center">Восстановить из файла</label><input type="file" id="imp" accept=".json,application/json" hidden></div>
    <p class="sync" id="bmsg" style="margin-top:8px"></p>
  </section>
</div>
<div id="sheet"></div>

<script>
const range=(a,b,s=1)=>{const r=[];for(let x=a;x<=b;x+=s)r.push(x);return r};
const uniq=a=>[...new Set(a)].sort((x,y)=>x-y);
const fh=uniq([].concat(...range(1,6).map(a=>range(1,6).filter(b=>b!==a).map(b=>3*a+2*b))));
const tp=range(6,22,2);
const UP=[1,2,3,4,5,6].map((n,i)=>({id:'u'+n,name:['Единицы','Двойки','Тройки','Четвёрки','Пятёрки','Шестёрки'][i],hint:'сумма '+['единиц','двоек','троек','четвёрок','пятёрок','шестёрок'][i],vals:range(0,5).map(k=>k*n),par:3*n}));
const LOW=[
  {id:'three',name:'Тройка',hint:'три одинаковых, сумма всех кубиков',vals:[0,...range(5,30)]},
  {id:'four',name:'Каре',hint:'четыре одинаковых, сумма всех кубиков',vals:[0,...range(5,30)]},
  {id:'small',name:'Малый стрит',hint:'четыре подряд',vals:[0,30]},
  {id:'large',name:'Большой стрит',hint:'пять подряд',vals:[0,40]},
  {id:'house',name:'Фулл-хаус',hint:'тройка + пара',vals:[0,25]},
  {id:'chance',name:'Шанс',hint:'сумма всех кубиков',vals:range(5,30).concat([0]).sort((a,b)=>a-b)},
  {id:'yatzy',name:'Яцзы',hint:'пять одинаковых',vals:[0,50]},
];
const ALL=[...UP,...LOW];
const JK={id:'joker',name:'Джокер',hint:'повторный Яцзы: +100, и 0 в любую свободную клетку',vals:[0,100,200,300]};
const blank=()=>({names:['Евгений','Игрок 2'],scores:[{},{}],started:Date.now(),saved:false});

let state=blank(), history=[], ui={confirm:false};
try{const s=JSON.parse(localStorage.getItem('yatzy.state'));if(s&&s.scores)state=s}catch(e){}
try{const h=JSON.parse(localStorage.getItem('yatzy.hist'));if(Array.isArray(h))history=h}catch(e){}

function totals(p){
  const s=state.scores[p];let up=0,low=0;
  UP.forEach(c=>{if(s[c.id]!=null)up+=s[c.id]});
  LOW.forEach(c=>{if(s[c.id]!=null)low+=s[c.id]});
  const par=UP.reduce((a,c)=>a+(s[c.id]!=null?s[c.id]-c.par:0),0);
  const bonus=up>=63?50:0;
  const jk=s.joker||0;
  return {up,bonus,low,jk,total:up+bonus+low+jk,par,filled:ALL.filter(c=>s[c.id]!=null).length};
}
const done=()=>[0,1].every(p=>totals(p).filled===ALL.length);
function whoseTurn(){const a=totals(0).filled,b=totals(1).filled;if(done())return -1;return a<=b?0:1}

function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}

function render(){
  const T=[totals(0),totals(1)],turn=whoseTurn();
  [0,1].forEach(p=>{
    const th=document.getElementById('h'+p);
    th.className=turn===p?'active':'';
    if(!th.querySelector('input')){
      th.innerHTML='<span class="turn"></span><input class="pname" id="name'+p+'" aria-label="Имя игрока '+(p+1)+'" maxlength="16">';
      const inp=th.querySelector('input');
      inp.addEventListener('change',()=>{state.names[p]=inp.value.trim()||('Игрок '+(p+1));save();render()});
    }
    th.querySelector('.turn').textContent=turn===p?'ходит':'';
    const inp=th.querySelector('input');if(document.activeElement!==inp)inp.value=state.names[p];
  });
  const cell=(p,c)=>{const v=state.scores[p][c.id];const cls=v==null?'empty':v===0?'zero':'';
    return `<td class="cell${turn===p?' colact':''}"><button class="${cls}" data-p="${p}" data-c="${c.id}" aria-label="${esc(state.names[p])}: ${c.name}">${v==null?'—':v}</button></td>`};
  const row=c=>`<tr><td><span class="catname">${c.name}</span><span class="hint">${c.hint}</span></td>${cell(0,c)}${cell(1,c)}</tr>`;
  const need=t=>t.bonus?'':(t.par>=0?`<span class="need">идёт к бонусу +${t.par}</span>`:`<span class="need">не хватает ${-t.par}</span>`);
  let h=`<tr class="section"><td colspan="3">Верхняя часть</td></tr>`+UP.map(row).join('');
  h+=`<tr class="sum"><td>Сумма</td>${T.map(t=>`<td class="v">${t.up}</td>`).join('')}</tr>`;
  h+=`<tr class="sum bonus"><td>Бонус<span class="hint">50 очков при 63+</span></td>${T.map(t=>`<td class="v${t.bonus?' got':''}">${t.bonus?'+50':'0'}${t.filled?need(t):''}</td>`).join('')}</tr>`;
  h+=`<tr class="section"><td colspan="3">Нижняя часть</td></tr>`+LOW.map(row).join('')+row(JK);
  const lead=T[0].total===T[1].total?-1:(T[0].total>T[1].total?0:1);
  h+=`<tr class="total"><td>Итого</td>${T.map((t,i)=>`<td class="${lead===i&&t.total?'lead':''}">${t.total}</td>`).join('')}</tr>`;
  document.getElementById('body').innerHTML=h;

  const bn=document.getElementById('banner');
  if(done()){
    const msg=lead<0?`Ничья, ${T[0].total} : ${T[1].total}`:`Победа: ${esc(state.names[lead])}, ${T[lead].total} : ${T[1-lead].total}`;
    bn.innerHTML=`<div class="banner"><strong>${msg}</strong><button class="btn primary" id="again">Новая игра</button></div>`;
    document.getElementById('again').onclick=()=>newGame();
  } else bn.innerHTML='';

  const ac=document.getElementById('actions');
  if(ui.confirm){
    ac.innerHTML=`<div class="confirm"><span>${done()?'Начать новую игру?':'Игра не закончена. Начать заново? Текущий счёт не попадёт в историю.'}</span><button class="btn danger" id="yes">Да, новая игра</button><button class="btn" id="no">Отмена</button></div>`;
    document.getElementById('yes').onclick=()=>{ui.confirm=false;newGame()};
    document.getElementById('no').onclick=()=>{ui.confirm=false;render()};
  } else {
    ac.innerHTML=`<button class="btn" id="ng">Новая игра</button><button class="btn" id="sw">Поменять местами</button>`;
    document.getElementById('ng').onclick=()=>{if(done())newGame();else{ui.confirm=true;render()}};
    document.getElementById('sw').onclick=()=>{state.names.reverse();state.scores.reverse();save();render()};
  }
  renderHist();
}

function renderHist(){
  const list=[...history].sort((a,b)=>b.at-a.at);
  const wins={};list.forEach(g=>{const k=g.winner==null?'Ничьи':g.winner;wins[k]=(wins[k]||0)+1});
  document.getElementById('tally').innerHTML=list.length?Object.entries(wins).map(([k,v])=>`<span class="chip">${esc(k)}: ${v}</span>`).join(''):'';
  document.getElementById('hist').innerHTML=list.length?list.slice(0,50).map(g=>{
    const d=new Date(g.at).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
    const r=g.players.map(p=>p.name===g.winner?`<b>${esc(p.name)} ${p.total}</b>`:`${esc(p.name)} ${p.total}`).join(' : ');
    return `<li><span class="res">${r}</span><span class="date">${d}</span></li>`}).join(''):'<li class="empty-h">Здесь появятся сыгранные партии с датой и счётом.</li>';
}

function openSheet(p,cid){
  const c=[...ALL,JK].find(x=>x.id===cid),cur=state.scores[p][cid];
  const el=document.getElementById('sheet');
  el.innerHTML=`<div class="sheet-bg" id="bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${c.name}">
    <h3>${esc(state.names[p])} · ${c.name}</h3><p>${c.hint}. 0 — вычеркнуть.</p>
    <div class="vals">${c.vals.map(v=>`<button data-v="${v}" class="${v===cur?'sel':''}${v===0?' z':''}">${v}</button>`).join('')}</div>
    <div class="row">${cur!=null?'<button class="btn" id="clr">Стереть</button>':''}<button class="btn" id="cancel">Отмена</button></div>
  </div></div>`;
  const close=()=>{el.innerHTML=''};
  el.querySelector('#bg').onclick=e=>{if(e.target.id==='bg')close()};
  el.querySelector('#cancel').onclick=close;
  const clr=el.querySelector('#clr');if(clr)clr.onclick=()=>{delete state.scores[p][cid];save();close();render()};
  el.querySelectorAll('.vals button').forEach(b=>b.onclick=()=>{state.scores[p][cid]=+b.dataset.v;save();close();render()});
  const f=el.querySelector('.vals .sel')||el.querySelector('.vals button');f&&f.focus();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('sheet').innerHTML=''});
document.getElementById('body').addEventListener('click',e=>{const b=e.target.closest('button[data-c]');if(b)openSheet(+b.dataset.p,b.dataset.c)});

function newGame(){
  if(done()&&!state.saved)archive();
  const names=state.names.slice();
  state=blank();state.names=names;save();render();window.scrollTo({top:0,behavior:'smooth'});
}
function archive(){
  const T=[totals(0),totals(1)];
  const g={at:Date.now(),players:[0,1].map(p=>({name:state.names[p],total:T[p].total,scores:state.scores[p]})),
    winner:T[0].total===T[1].total?null:state.names[T[0].total>T[1].total?0:1]};
  state.saved=true;history.push(g);
  try{localStorage.setItem('yatzy.hist',JSON.stringify(history))}catch(e){}
  renderHist();
}

function save(){
  try{localStorage.setItem('yatzy.state',JSON.stringify(state))}catch(e){}
  if(done()&&!state.saved)archive();
}
function setSync(s){document.getElementById('sync').textContent=s}

render();

document.getElementById('exp').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'yatzy',v:1,saved:Date.now(),history,state},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='yatzy-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  document.getElementById('bmsg').textContent='Партий в копии: '+history.length;
};
document.getElementById('imp').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const m=document.getElementById('bmsg');
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.history))throw 0;
    const seen=new Set(history.map(g=>g.at));let n=0;
    d.history.forEach(g=>{if(!seen.has(g.at)){history.push(g);n++}});
    try{localStorage.setItem('yatzy.hist',JSON.stringify(history))}catch(_){}
    renderHist();m.textContent='Восстановлено партий: '+n+'. Всего в истории: '+history.length;
  }catch(_){m.textContent='Это не файл копии Яцзы. Выберите файл yatzy-….json'}
  e.target.value='';
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body></html>
